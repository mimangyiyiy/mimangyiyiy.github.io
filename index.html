<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>我的作品集</title>

<style>
/* ================= 基础变量 ================= */
:root {
  --blue: #4C97FF;
  --orange: #FFAB19;
}

/* ================= Body ================= */
body {
  margin: 0;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  color: #ffffff;
  position: relative;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  background-image: url('https://ts1.tc.mm.bing.net/th/id/R-C.b0ea268fa1be279d112489ce83ad4696?rik=qItsh%2fBiy33hlg&riu=http%3a%2f%2fwww.quazero.com%2fuploads%2fallimg%2f140303%2f1-140303215009.jpg&ehk=S6PLWamt%2bMzQV8uO9ugcU5d5M19BpXtCpNz2cRJ7q9M%3d&risl=&pid=ImgRaw&r=0');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
}

/* 深色遮罩层 */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  pointer-events: none;
  z-index: 0;
}

header, .container, .download-float, .glass-toggle {
  position: relative;
  z-index: 2;
}

/* ===== 关闭毛玻璃模式：纯色背景 + 黑色文字 ===== */
body.glass-off {
  color: #000 !important;
  background-image: none !important;
  background-color: #f5f5f7 !important;
}
body.glass-off::before {
  display: none !important;
}

/* 所有毛玻璃元素变成不透明纯色 */
body.glass-off .glass,
body.glass-off .project-card,
body.glass-off .download-panel,
body.glass-off .download-trigger,
body.glass-off .glass-toggle,
body.glass-off header {
  background: #ffffff !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  border: 1px solid #e0e0e0 !important;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08) !important;
  color: #000 !important;
}

/* 卡片内文字变黑 */
body.glass-off .project-card h3,
body.glass-off .project-card p,
body.glass-off .project-card .btn {
  color: #000 !important;
}

/* 卡片内按钮调整 */
body.glass-off .project-card .btn {
  background: #4C97FF !important;
  color: #fff !important;
}

/* 标题和描述文字变黑 */
body.glass-off .section-title,
body.glass-off .section-desc,
body.glass-off header h1,
body.glass-off header p {
  color: #000 !important;
  text-shadow: none !important;
}

/* 下载面板文字变黑 */
body.glass-off .download-panel h4,
body.glass-off .download-item,
body.glass-off .download-item .info .title,
body.glass-off .download-item .info .desc {
  color: #000 !important;
}

/* 下载按钮图标变黑 */
body.glass-off .download-trigger svg,
body.glass-off .glass-toggle svg {
  fill: #000 !important;
}

/* 涟漪效果在关闭毛玻璃时隐藏 */
body.glass-off .ripple {
  display: none !important;
}

/* ================= 毛玻璃风格 ================= */
.glass {
  background: rgba(30, 35, 65, 0.45);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: inherit;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

body.glass-off .glass {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: none;
  border: 1px solid rgba(0, 0, 0, 0.1);
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  color: #333;
}

/* ===== 卡片样式（更通透） ===== */
.project-card {
  position: relative;
  padding: 1.5rem;
  text-align: center;
  border-radius: 20px;
  background: rgba(25, 30, 55, 0.35);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  color: white;
  transition: box-shadow 0.3s ease;
  transform-style: preserve-3d;
  will-change: transform;
  cursor: default;
}

body.glass-off .project-card {
  background: rgba(255, 255, 255, 0.75);
  border: 1px solid rgba(0, 0, 0, 0.08);
  color: #333;
}

.project-card:hover {
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}

.project-image {
  height: 150px;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 1rem;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  transition: transform 0.2s;
}

.project-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s;
  pointer-events: none;
}

.project-card:hover .project-image img {
  transform: scale(1.03);
}

.project-card h3 {
  margin: 0.5rem 0;
  font-size: 1.2rem;
  transform: translateZ(6px);
}

.project-card .btn {
  display: inline-block;
  padding: 0.6rem 1.5rem;
  border-radius: 50px;
  font-weight: bold;
  text-decoration: none;
  background: var(--blue);
  color: white;
  transition: all 0.2s;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
  transform: translateZ(6px);
}

.project-card .btn:hover {
  background: #3a7be0;
  box-shadow: 0 8px 20px rgba(76, 151, 255, 0.4);
  transform: translateZ(8px) scale(1.02);
}

body.glass-off .project-card .btn {
  color: #fff;
}

/* ===== 按钮和下载 ===== */
.glass-toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 9999;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(30, 35, 65, 0.5);
  backdrop-filter: blur(14px);
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.05s linear;
}
.glass-toggle svg {
  width: 22px;
  height: 22px;
  fill: white;
}
body.glass-off .glass-toggle svg {
  fill: #333;
}

.download-float {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 9999;
}
.download-trigger {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(30, 35, 65, 0.5);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.25);
  cursor: pointer;
  transition: transform 0.05s linear;
}
.download-trigger svg {
  width: 24px;
  height: 24px;
  fill: white;
}
.download-panel {
  position: absolute;
  right: 0;
  bottom: 70px;
  width: 280px;
  padding: 16px;
  display: none;
  backdrop-filter: blur(20px);
  background: rgba(25, 30, 55, 0.85);
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.2);
  max-height: 400px;
  overflow-y: auto;
}
.download-panel h4 {
  margin-top: 0;
  margin-bottom: 12px;
  color: white;
}
.download-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 14px;
  margin-bottom: 6px;
  color: white;
  background: rgba(255,255,255,0.05);
}
.download-item .info {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}
.download-item .info .title {
  font-weight: bold;
  font-size: 13px;
}
.download-item .info .desc {
  font-size: 11px;
  opacity: 0.7;
}
.download-item a {
  padding: 4px 12px;
  background: var(--blue);
  color: white;
  border-radius: 20px;
  text-decoration: none;
  font-size: 12px;
  flex-shrink: 0;
  margin-left: 8px;
}
.download-mask {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 9998;
  display: none;
}

header {
  text-align: center;
  padding: 2.5rem 1rem;
  background: linear-gradient(135deg, rgba(50, 80, 180, 0.4), rgba(80, 60, 140, 0.4));
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.15);
}
header h1 {
  color: white;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  margin: 0;
  font-size: 2rem;
}
header p {
  color: rgba(255,255,255,0.7);
  margin: 0.3rem 0 0;
  font-size: 0.95rem;
}

#projectContainer {
  max-width: 1200px;
  margin: 2rem auto;
  padding: 0 1rem;
}
.section-title {
  font-size: 1.6rem;
  border-left: 4px solid var(--orange);
  padding-left: 10px;
  margin-bottom: 0.4rem;
  color: white;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
.project-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 2rem;
  perspective: 1200px;
  margin-bottom: 2rem;
}
.loading-placeholder {
  text-align: center;
  padding: 40px;
  color: rgba(255,255,255,0.5);
  font-size: 18px;
}

.ripple {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 10000;
  transform: translate(-50%, -50%);
  animation: rippleAnim 1s ease-out forwards;
}
body.glass-on .ripple {
  border: 2px solid rgba(100, 150, 255, 0.6);
}
body.glass-off .ripple {
  border: 2px solid rgba(0,0,0,0.3);
}
@keyframes rippleAnim {
  from { width: 32px; height: 32px; opacity: 1; }
  to { width: 140px; height: 140px; opacity: 0; }
}

@media (max-width: 768px) {
  .project-list { gap: 1.25rem; }
  .download-panel { width: 240px; right: 0; }
  header h1 { font-size: 1.5rem; }
}
</style>
</head>

<body class="glass-on">

<div class="glass-toggle" id="glassToggle">
  <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h11v2zm0-4H6V7h11v2z"/></svg>
</div>

<header class="glass">
  <h1>我的作品集</h1>
  <p>✨ 3D吸附卡片 · 动态分类 · 动态下载 ✨</p>
</header>

<div id="projectContainer">
  <div class="loading-placeholder">⏳ 加载作品中...</div>
</div>

<div class="download-mask" id="mask"></div>
<div class="download-float">
  <button class="download-trigger glass" id="downloadBtn">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
  </button>
  <div class="download-panel glass" id="panel">
    <h4>📦 资源下载</h4>
    <div id="downloadList"><div style="color:rgba(255,255,255,0.5); text-align:center; padding:10px;">加载中...</div></div>
  </div>
</div>

<script>
// ============================================================
// 1. API 配置
// ============================================================
const API_BASE = '';

// ============================================================
// 2. 工具函数
// ============================================================
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
// 3. 加载并渲染作品（动态分类）
// ============================================================
async function loadProjects() {
  const container = document.getElementById('projectContainer');
  if (!container) return;
  container.innerHTML = '<div class="loading-placeholder">⏳ 加载作品中...</div>';
  
  try {
    const res = await fetch(`${API_BASE}/api/projects`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const projects = await res.json();
    renderProjects(projects, container);
  } catch (e) {
    console.error('加载作品失败:', e);
    container.innerHTML = `<div style="color:#FF6B6B; text-align:center; padding:40px;">⚠️ 加载失败，请刷新重试</div>`;
  }
}

function renderProjects(projects, container) {
  const groups = {};
  projects.forEach(p => {
    const catName = p.category_name || '未分类';
    if (!groups[catName]) groups[catName] = [];
    groups[catName].push(p);
  });

  const categoryNames = Object.keys(groups);
  container.innerHTML = '';

  if (categoryNames.length === 0) {
    container.innerHTML = `<div style="color:rgba(255,255,255,0.5); text-align:center; padding:40px;">暂无作品</div>`;
    return;
  }

  categoryNames.forEach(catName => {
    const projectsInCat = groups[catName];
    const section = document.createElement('div');
    section.className = 'container';
    section.style.maxWidth = '1200px';
    section.style.margin = '0 auto 2rem auto';
    section.style.padding = '0 1rem';
    
    const title = document.createElement('h2');
    title.className = 'section-title';
    title.textContent = catName;
    section.appendChild(title);
    
    const list = document.createElement('div');
    list.className = 'project-list';
    list.innerHTML = projectsInCat.map(p => `
      <div class="project-card" data-tilt>
        <div class="project-image">
          <img src="${p.image || 'https://placehold.co/400x200?text=No+Image'}" alt="${p.title}" loading="lazy" onerror="this.src='https://placehold.co/400x200?text=加载失败'">
        </div>
        <h3>${escapeHtml(p.title)}</h3>
        <a href="${escapeHtml(p.link)}" class="btn" target="_blank">查看作品</a>
      </div>
    `).join('');
    
    section.appendChild(list);
    container.appendChild(section);
  });

  bindCardTiltEffects();
}

// ============================================================
// 4. ✨ 3D吸附式卡片倾斜效果
// ============================================================
function bindCardTiltEffects() {
  const cards = document.querySelectorAll('.project-card[data-tilt]');
  
  cards.forEach(card => {
    card.removeEventListener('mousemove', tiltHandler);
    card.removeEventListener('mouseleave', resetHandler);
    
    function tiltHandler(e) {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      
      // ✅ 朝鼠标方向吸附（鼠标在右 → 卡片向右转）
      const rotateY = (x - 0.5) * 18;
      const rotateX = (0.5 - y) * 18;
      const offsetX = (x - 0.5) * 14;
      const offsetY = (y - 0.5) * 14;
      const distFromCenter = Math.sqrt(Math.pow(x - 0.5, 2) + Math.pow(y - 0.5, 2));
      const scale = 1 + distFromCenter * 0.05;
      
      card.style.transition = 'transform 0.06s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
      card.style.transform = `
        perspective(800px) 
        rotateX(${rotateX}deg) 
        rotateY(${rotateY}deg) 
        translateX(${offsetX}px) 
        translateY(${offsetY}px) 
        scale(${scale})
      `;
    }
    
    function resetHandler() {
      card.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
      card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateX(0px) translateY(0px) scale(1)';
    }
    
    card.addEventListener('mousemove', tiltHandler);
    card.addEventListener('mouseleave', resetHandler);
  });
}

// ============================================================
// 5. 下载加载（动态）
// ============================================================
async function loadDownloads() {
  const container = document.getElementById('downloadList');
  if (!container) return;
  try {
    const res = await fetch(`${API_BASE}/api/downloads`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const downloads = await res.json();
    if (downloads.length === 0) {
      container.innerHTML = `<div style="color:rgba(255,255,255,0.5); text-align:center; padding:10px;">暂无资源</div>`;
      return;
    }
    container.innerHTML = downloads.map(item => `
      <div class="download-item">
        <div class="info">
          <span class="title">${escapeHtml(item.title)}</span>
          ${item.description ? `<span class="desc">${escapeHtml(item.description)}</span>` : ''}
        </div>
        <a href="${escapeHtml(item.link)}" target="_blank">${escapeHtml(item.link_text || '下载')}</a>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = `<div style="color:#FF6B6B; text-align:center; padding:10px;">⚠️ 加载失败</div>`;
  }
}

// ============================================================
// 6. 毛玻璃切换 + 下载面板 + 涟漪效果
// ============================================================
document.getElementById('glassToggle').onclick = () => {
  document.body.classList.toggle('glass-on');
  document.body.classList.toggle('glass-off');
};

const btn = document.getElementById('downloadBtn');
const panel = document.getElementById('panel');
const mask = document.getElementById('mask');

btn.onclick = () => {
  const show = panel.style.display === 'block';
  panel.style.display = show ? 'none' : 'block';
  mask.style.display = show ? 'none' : 'block';
  if (!show) loadDownloads();
};

mask.onclick = () => {
  panel.style.display = 'none';
  mask.style.display = 'none';
};

document.addEventListener('mousedown', e => {
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  ripple.style.left = e.clientX + 'px';
  ripple.style.top = e.clientY + 'px';
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 1000);
});

// ============================================================
// 7. 页面启动
// ============================================================
loadProjects();
loadDownloads();
console.log('🚀 作品集已启动（3D吸附式卡片效果）');
</script>
</body>
</html>
