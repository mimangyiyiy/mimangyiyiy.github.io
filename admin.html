<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a1a;
  color: #fff;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}
.container { max-width: 1000px; margin: 0 auto; }
h1, h2, h3 { margin-top: 0; }
.card {
  background: #1a1a2e;
  padding: 24px;
  border-radius: 16px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.08);
}
input, select, textarea {
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #2a2a4e;
  color: #fff;
  font-size: 14px;
  box-sizing: border-box;
}
input::placeholder { color: #888; }
select option { background: #2a2a4e; }
.btn {
  padding: 10px 22px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: all 0.2s;
}
.btn-primary { background: #4C97FF; color: #fff; }
.btn-primary:hover { background: #3a7be0; }
.btn-success { background: #4CAF50; color: #fff; }
.btn-success:hover { background: #3d8b40; }
.btn-warning { background: #FFAB19; color: #222; }
.btn-warning:hover { background: #e89a0f; }
.btn-danger { background: #FF6B6B; color: #fff; }
.btn-danger:hover { background: #e55a5a; }
.btn-secondary { background: #555; color: #fff; }
.btn-secondary:hover { background: #444; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.project-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #2a2a4e;
  border-radius: 10px;
  margin-bottom: 8px;
  gap: 10px;
}
.project-item .info {
  flex: 1;
  min-width: 0;
}
.project-item .info .title {
  font-weight: bold;
  display: block;
}
.project-item .info .sub {
  font-size: 12px;
  opacity: 0.6;
  display: block;
}
.project-item .actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.empty-msg {
  color: #888;
  text-align: center;
  padding: 30px;
}
#loginArea { display: block; }
#adminArea { display: none; }
.status-msg {
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
  display: none;
}
.status-msg.success { background: rgba(76, 175, 80, 0.2); color: #81C784; display: block; }
.status-msg.error { background: rgba(255, 107, 107, 0.2); color: #FF6B6B; display: block; }

.upload-area {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.upload-area input[type="file"] {
  flex: 1;
  min-width: 150px;
  padding: 8px;
  background: #2a2a4e;
  border-radius: 8px;
  border: 1px solid #333;
  color: #fff;
  margin-bottom: 0;
}
.upload-area .btn { flex-shrink: 0; }

.tabs {
  display: flex;
  gap: 0;
  margin-bottom: 20px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #333;
  flex-wrap: wrap;
}
.tab-btn {
  flex: 1;
  padding: 12px 16px;
  background: #1a1a2e;
  border: none;
  color: #888;
  cursor: pointer;
  font-weight: bold;
  font-size: 13px;
  transition: all 0.2s;
  min-width: 80px;
}
.tab-btn.active {
  background: #4C97FF;
  color: #fff;
}
.tab-btn:hover:not(.active) {
  background: #2a2a4e;
  color: #fff;
}
.tab-content { display: none; }
.tab-content.active { display: block; }

/* 编辑弹窗 */
#editModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  z-index: 99999;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(5px);
}
#editModal .modal-content {
  background: #1a1a2e;
  padding: 30px;
  border-radius: 16px;
  max-width: 500px;
  width: 95%;
  max-height: 90vh;
  overflow-y: auto;
  border: 1px solid #333;
}
#editModal .modal-content h3 { margin-top: 0; }
#editModal .modal-content input,
#editModal .modal-content select,
#editModal .modal-content textarea {
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #2a2a4e;
  color: #fff;
  font-size: 14px;
  box-sizing: border-box;
}
#editModal .modal-content textarea { resize: vertical; min-height: 60px; }
#editModal .modal-content .btn-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
#editModal .modal-content .btn-row .btn { flex: 1; }

/* 上传文件管理表格 */
.file-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: #2a2a4e;
  border-radius: 8px;
  margin-bottom: 6px;
}
.file-item .name {
  font-size: 14px;
  word-break: break-all;
}
.file-item .size {
  font-size: 12px;
  opacity: 0.5;
  margin-left: 10px;
}
.file-item .actions { flex-shrink: 0; }
</style>
</head>
<body>

<div class="container">
  <h1>📝 管理后台</h1>
  
  <div id="statusMsg" class="status-msg"></div>
  
  <!-- ===== 登录区域 ===== -->
  <div id="loginArea" class="card">
    <h2>🔐 管理员登录</h2>
    <input id="loginUser" placeholder="用户名" autocomplete="username">
    <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn btn-primary" onclick="adminLogin()" style="width:100%;">登录</button>
  </div>
  
  <!-- ===== 管理区域 ===== -->
  <div id="adminArea">
    <div class="header-bar">
      <h2 style="margin:0;">📋 管理</h2>
      <button class="btn btn-danger" onclick="logout()">退出</button>
    </div>
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-projects" onclick="switchTab('tab-projects')">📂 作品</button>
      <button class="tab-btn" data-tab="tab-downloads" onclick="switchTab('tab-downloads')">📦 下载</button>
      <button class="tab-btn" data-tab="tab-files" onclick="switchTab('tab-files')">📁 文件</button>
      <button class="tab-btn" data-tab="tab-categories" onclick="switchTab('tab-categories')">🏷️ 分类</button>
    </div>
    
    <!-- ===== Tab 1: 作品管理 ===== -->
    <div id="tab-projects" class="tab-content active">
      <div class="card">
        <h3>➕ 添加作品</h3>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:4px; font-size:14px; color:#aaa;">📄 作品文件 (.html)</label>
          <div class="upload-area">
            <input type="file" id="newHtmlFile" accept=".html">
            <button class="btn btn-primary" onclick="uploadHtmlFile()">上传作品</button>
          </div>
          <div id="htmlUploadProgress" style="display:none; margin-top:6px; font-size:13px; color:#4C97FF;">⏳ 上传中...</div>
          <input id="newLink" placeholder="或手动输入作品链接 *" style="margin-top:8px;">
          <div class="hint" style="font-size:12px; color:#888; margin-top:4px;">💡 上传 .html 文件后会自动填入链接</div>
        </div>
        
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:4px; font-size:14px; color:#aaa;">📷 作品封面图片</label>
          <div class="upload-area">
            <input type="file" id="newImageFile" accept="image/*">
            <button class="btn btn-primary" onclick="uploadImageToImgBB()">上传图片</button>
          </div>
          <div id="uploadProgress" style="display:none; margin-top:6px; font-size:13px; color:#4C97FF;">⏳ 上传中...</div>
          <div id="imagePreview" style="display:none; margin-top:8px;">
            <img id="previewImg" src="" alt="预览" style="max-height:120px; border-radius:8px; border:1px solid #333;">
          </div>
          <input id="newImage" placeholder="或手动输入图片URL" style="margin-top:8px;">
          <div class="hint" style="font-size:12px; color:#888; margin-top:4px;">💡 支持 JPG / PNG / WebP / GIF，最大 32MB</div>
        </div>
        
        <input id="newTitle" placeholder="标题 *">
        <input id="newDesc" placeholder="描述">
        <select id="newCategory"></select>
        <button class="btn btn-success" onclick="addProject()" style="width:100%;">添加作品</button>
      </div>
      
      <div class="card">
        <h3>📋 所有作品</h3>
        <div id="projectListAdmin"><div class="empty-msg">加载中...</div></div>
      </div>
    </div>
    
    <!-- ===== Tab 2: 下载管理（含编辑） ===== -->
    <div id="tab-downloads" class="tab-content">
      <div class="card">
        <h3>➕ 添加下载项</h3>
        <input id="newDownloadTitle" placeholder="标题 *">
        <input id="newDownloadDesc" placeholder="描述（可选）">
        <input id="newDownloadLink" placeholder="链接 *">
        <input id="newDownloadLinkText" placeholder="按钮文字（默认：下载）" value="下载">
        <button class="btn btn-success" onclick="addDownload()" style="width:100%;">添加下载项</button>
      </div>
      
      <div class="card">
        <h3>📋 所有下载项</h3>
        <div id="downloadListAdmin"><div class="empty-msg">加载中...</div></div>
      </div>
    </div>
    
    <!-- ===== Tab 3: 文件管理（新增） ===== -->
    <div id="tab-files" class="tab-content">
      <div class="card">
        <h3>📁 上传的文件</h3>
        <div id="fileListAdmin"><div class="empty-msg">加载中...</div></div>
      </div>
    </div>
    
    <!-- ===== Tab 4: 分类管理 ===== -->
    <div id="tab-categories" class="tab-content">
      <div class="card">
        <h3>🏷️ 管理分类</h3>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
          <input id="newCategoryName" placeholder="新分类名称" style="flex:1; margin-bottom:0;">
          <button class="btn btn-success" onclick="addCategory()" style="flex-shrink:0;">添加</button>
        </div>
        <div id="categoryList"><div class="empty-msg">加载中...</div></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 编辑弹窗（下载项 + 作品共用） ===== -->
<div id="editModal">
  <div class="modal-content">
    <h3 id="editModalTitle">✏️ 编辑</h3>
    <input id="editId" type="hidden">
    <div id="editFields">
      <!-- 动态填充 -->
    </div>
    <div class="btn-row">
      <button class="btn btn-success" onclick="saveEdit()">保存修改</button>
      <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 1. 配置
// ============================================================
const API_BASE = '';
const IMGBB_API_KEY = '你的ImgBB_API_Key';

// ============================================================
// 2. 工具函数
// ============================================================
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showStatus(msg, type = 'success') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
  setTimeout(() => { el.className = 'status-msg'; }, 4000);
}

function getToken() {
  return localStorage.getItem('adminToken');
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
  // 切换时刷新对应数据
  if (tabId === 'tab-files') loadAdminFiles();
  if (tabId === 'tab-downloads') loadAdminDownloads();
}

// ============================================================
// 3. 登录 / 退出
// ============================================================
async function adminLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  
  if (!username || !password) {
    showStatus('请输入用户名和密码', 'error');
    return;
  }
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    const data = await res.json();
    if (res.ok && data.token) {
      localStorage.setItem('adminToken', data.token);
      document.getElementById('loginArea').style.display = 'none';
      document.getElementById('adminArea').style.display = 'block';
      await Promise.all([
        loadCategoriesWithDelete(),
        loadAdminProjects(),
        loadAdminDownloads(),
        loadAdminFiles()
      ]);
      showStatus('✅ 登录成功');
    } else {
      showStatus('❌ ' + (data.error || '用户名或密码错误'), 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

function logout() {
  localStorage.removeItem('adminToken');
  document.getElementById('loginArea').style.display = 'block';
  document.getElementById('adminArea').style.display = 'none';
  showStatus('已退出');
}

// ============================================================
// 4. 分类管理
// ============================================================
let deletingCategoryId = null;

async function loadCategoriesWithDelete() {
  try {
    const res = await fetch(`${API_BASE}/api/categories`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const categories = await res.json();

    const select = document.getElementById('newCategory');
    select.innerHTML = categories.map(c => 
      `<option value="${c.id}">${escapeHtml(c.name)}</option>`
    ).join('');

    const container = document.getElementById('categoryList');
    if (categories.length === 0) {
      container.innerHTML = '<div class="empty-msg">暂无分类，请添加</div>';
      return;
    }

    container.innerHTML = categories.map(c => `
      <div class="project-item">
        <span>${escapeHtml(c.name)}</span>
        <button class="btn btn-danger btn-sm" onclick="deleteCategoryWithCheck(${c.id})">删除</button>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('categoryList').innerHTML = `<div class="empty-msg">❌ 加载失败</div>`;
  }
}

async function addCategory() {
  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }
  
  const name = document.getElementById('newCategoryName').value.trim();
  if (!name) { showStatus('请输入分类名称', 'error'); return; }
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/categories`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ name })
    });
    
    if (res.ok) {
      showStatus('✅ 分类添加成功');
      document.getElementById('newCategoryName').value = '';
      await loadCategoriesWithDelete();
    } else {
      const err = await res.json();
      showStatus('❌ ' + (err.error || '添加失败'), 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

async function deleteCategoryWithCheck(categoryId) {
  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/categories/${categoryId}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({})
    });
    
    const data = await res.json();
    
    if (res.ok) {
      showStatus('✅ 分类已删除');
      await loadCategoriesWithDelete();
      return;
    }
    
    if (data.hasProjects) {
      deletingCategoryId = categoryId;
      // 简单处理：提示有作品
      showStatus('❌ 该分类下还有作品，请先删除或转移作品', 'error');
    } else {
      showStatus('❌ ' + (data.error || '删除失败'), 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

// ============================================================
// 5. 作品管理
// ============================================================
async function loadAdminProjects() {
  try {
    const res = await fetch(`${API_BASE}/api/projects`);
    if (!res.ok) throw new Error();
    const projects = await res.json();
    
    const container = document.getElementById('projectListAdmin');
    if (projects.length === 0) {
      container.innerHTML = '<div class="empty-msg">暂无作品</div>';
      return;
    }
    
    container.innerHTML = projects.map(p => `
      <div class="project-item">
        <div class="info">
          <span class="title">${escapeHtml(p.title)}</span>
          <span class="sub">${escapeHtml(p.category_name || '未分类')} · ${escapeHtml(p.link || '无链接')}</span>
        </div>
        <div class="actions">
          <button class="btn btn-warning btn-sm" onclick="openEditProject(${p.id})">✏️ 编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteProject(${p.id})">删除</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('projectListAdmin').innerHTML = '<div class="empty-msg">❌ 加载失败</div>';
  }
}

async function addProject() {
  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }
  
  const title = document.getElementById('newTitle').value.trim();
  const link = document.getElementById('newLink').value.trim();
  const categoryId = document.getElementById('newCategory').value;
  
  if (!title || !link) {
    showStatus('标题和链接为必填项', 'error');
    return;
  }
  
  const data = {
    title,
    description: document.getElementById('newDesc').value.trim(),
    image: document.getElementById('newImage').value.trim() || 'https://placehold.co/400x200?text=作品封面',
    link,
    category_id: parseInt(categoryId) || null
  };
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/projects`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify(data)
    });
    
    if (res.ok) {
      showStatus('✅ 添加成功！');
      document.getElementById('newTitle').value = '';
      document.getElementById('newDesc').value = '';
      document.getElementById('newImage').value = '';
      document.getElementById('newLink').value = '';
      document.getElementById('imagePreview').style.display = 'none';
      document.getElementById('newImageFile').value = '';
      document.getElementById('newHtmlFile').value = '';
      loadAdminProjects();
    } else {
      const err = await res.json();
      showStatus('❌ ' + (err.error || '添加失败'), 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

async function deleteProject(id) {
  if (!confirm('确定要删除这个作品吗？')) return;
  const token = getToken();
  try {
    const res = await fetch(`${API_BASE}/api/admin/projects/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.ok) {
      showStatus('✅ 已删除');
      loadAdminProjects();
    } else {
      showStatus('❌ 删除失败', 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

// ============================================================
// 6. 下载项管理（含编辑）
// ============================================================
async function loadAdminDownloads() {
  try {
    const res = await fetch(`${API_BASE}/api/downloads`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const downloads = await res.json();
    
    const container = document.getElementById('downloadListAdmin');
    if (downloads.length === 0) {
      container.innerHTML = '<div class="empty-msg">暂无下载项</div>';
      return;
    }
    
    container.innerHTML = downloads.map(d => `
      <div class="project-item">
        <div class="info">
          <span class="title">${escapeHtml(d.title)}</span>
          <span class="sub">${escapeHtml(d.link)}${d.description ? ' · ' + escapeHtml(d.description) : ''}</span>
        </div>
        <div class="actions">
          <button class="btn btn-warning btn-sm" onclick="openEditDownload(${d.id})">✏️ 编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteDownload(${d.id})">删除</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('downloadListAdmin').innerHTML = '<div class="empty-msg">❌ 加载失败</div>';
  }
}

async function addDownload() {
  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }
  
  const title = document.getElementById('newDownloadTitle').value.trim();
  const link = document.getElementById('newDownloadLink').value.trim();
  const description = document.getElementById('newDownloadDesc').value.trim();
  const linkText = document.getElementById('newDownloadLinkText').value.trim() || '下载';
  
  if (!title || !link) {
    showStatus('标题和链接为必填项', 'error');
    return;
  }
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/downloads`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ title, description, link, link_text: linkText })
    });
    
    if (res.ok) {
      showStatus('✅ 下载项添加成功！');
      document.getElementById('newDownloadTitle').value = '';
      document.getElementById('newDownloadDesc').value = '';
      document.getElementById('newDownloadLink').value = '';
      document.getElementById('newDownloadLinkText').value = '下载';
      loadAdminDownloads();
    } else {
      const err = await res.json();
      showStatus('❌ ' + (err.error || '添加失败'), 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

async function deleteDownload(id) {
  if (!confirm('确定要删除这个下载项吗？')) return;
  const token = getToken();
  try {
    const res = await fetch(`${API_BASE}/api/admin/downloads/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.ok) {
      showStatus('✅ 已删除');
      loadAdminDownloads();
    } else {
      showStatus('❌ 删除失败', 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

// ============================================================
// 7. 文件管理（新增）
// ============================================================
async function loadAdminFiles() {
  try {
    const res = await fetch(`${API_BASE}/api/files`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const files = await res.json();
    
    const container = document.getElementById('fileListAdmin');
    if (!files || files.length === 0) {
      container.innerHTML = '<div class="empty-msg">暂无上传的文件</div>';
      return;
    }
    
    container.innerHTML = files.map(f => `
      <div class="file-item" style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:#2a2a4e; border-radius:8px; margin-bottom:6px;">
        <div style="flex:1; min-width:0;">
          <span style="font-size:14px;">📄 ${escapeHtml(f.filename)}</span>
          <span style="font-size:12px; opacity:0.5; margin-left:10px;">${f.size ? (f.size / 1024).toFixed(1) + ' KB' : ''}</span>
          <span style="font-size:12px; margin-left:10px; ${f.used ? 'color:#81C784;' : 'color:#888;'}">
            ${f.status}
          </span>
        </div>
        <div style="display:flex; gap:6px; flex-shrink:0;">
          <a href="${escapeHtml(f.url)}" target="_blank" class="btn btn-primary btn-sm">查看</a>
          ${f.used ? `<span style="font-size:11px; color:#888; padding:5px 8px;">🔗 被引用</span>` : `<button class="btn btn-danger btn-sm" onclick="deleteFile('${escapeHtml(f.filename)}')">删除</button>`}
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('fileListAdmin').innerHTML = '<div class="empty-msg">❌ 加载失败：' + e.message + '</div>';
  }
}

async function deleteFile(filename) {
  if (!confirm(`确定要删除 "${filename}" 吗？`)) return;
  const token = getToken();
  try {
    const res = await fetch(`${API_BASE}/api/admin/files/${encodeURIComponent(filename)}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.ok) {
      showStatus('✅ 文件已删除');
      loadAdminFiles();
    } else {
      const err = await res.json();
      showStatus('❌ ' + (err.error || '删除失败'), 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

// ============================================================
// 8. 上传 .html 文件
// ============================================================
async function uploadHtmlFile() {
  const fileInput = document.getElementById('newHtmlFile');
  const file = fileInput.files[0];
  
  if (!file) { showStatus('请先选择 .html 文件', 'error'); return; }
  if (!file.name.endsWith('.html')) { showStatus('只支持 .html 文件', 'error'); return; }
  if (file.size > 10 * 1024 * 1024) { showStatus('文件大小不能超过 10MB', 'error'); return; }

  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }

  const progressEl = document.getElementById('htmlUploadProgress');
  progressEl.style.display = 'block';
  progressEl.textContent = '⏳ 上传中...';

  try {
    const content = await file.text();
    const res = await fetch(`${API_BASE}/api/admin/upload-html`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ fileName: file.name, content })
    });

    const data = await res.json();
    if (res.ok && data.success) {
      document.getElementById('newLink').value = data.url;
      showStatus('✅ 作品文件上传成功！');
      progressEl.textContent = '✅ 上传完成';
      loadAdminFiles();
    } else {
      showStatus('❌ ' + (data.error || '上传失败'), 'error');
      progressEl.style.display = 'none';
    }
  } catch (e) {
    showStatus('❌ 上传失败：' + e.message, 'error');
    progressEl.style.display = 'none';
  }
  setTimeout(() => { progressEl.style.display = 'none'; }, 3000);
}

// ============================================================
// 9. 图片上传（ImgBB）
// ============================================================
async function uploadImageToImgBB() {
  const fileInput = document.getElementById('newImageFile');
  const file = fileInput.files[0];
  if (!file) { showStatus('请先选择一张图片', 'error'); return; }
  if (file.size > 32 * 1024 * 1024) { showStatus('图片大小不能超过 32MB', 'error'); return; }

  const progressEl = document.getElementById('uploadProgress');
  progressEl.style.display = 'block';
  progressEl.textContent = '⏳ 上传到图床...';

  try {
    const base64 = await fileToBase64(file);
    const formData = new FormData();
    formData.append('key', IMGBB_API_KEY);
    formData.append('image', base64.split(',')[1]);
    formData.append('name', file.name);

    const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
    const data = await response.json();

    if (data.success) {
      document.getElementById('newImage').value = data.data.url;
      const preview = document.getElementById('imagePreview');
      const previewImg = document.getElementById('previewImg');
      previewImg.src = data.data.url;
      preview.style.display = 'block';
      showStatus('✅ 图片上传成功！');
      progressEl.textContent = '✅ 上传完成';
    } else {
      showStatus('❌ 上传失败：' + (data.error?.message || '未知错误'), 'error');
      progressEl.style.display = 'none';
    }
  } catch (e) {
    showStatus('❌ 上传失败：' + e.message, 'error');
    progressEl.style.display = 'none';
  }
  setTimeout(() => { progressEl.style.display = 'none'; }, 3000);
}

// 图片预览
document.addEventListener('DOMContentLoaded', function() {
  const fileInput = document.getElementById('newImageFile');
  if (fileInput) {
    fileInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById('imagePreview');
          const previewImg = document.getElementById('previewImg');
          previewImg.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });
  }
});

// 10. 编辑弹窗（下载项编辑）

let editType = '';
let editId = null;

function openEditDownload(id) {
  editType = 'download';
  editId = id;
  document.getElementById('editModalTitle').textContent = '✏️ 编辑下载项';
  
  // 先从列表获取数据
  fetch(`${API_BASE}/api/downloads`)
    .then(r => r.json())
    .then(data => {
      const item = data.find(d => d.id === id);
      if (!item) { showStatus('未找到该下载项', 'error'); return; }
      
      document.getElementById('editFields').innerHTML = `
        <input id="editDownloadTitle" value="${escapeHtml(item.title)}" placeholder="标题 *">
        <input id="editDownloadDesc" value="${escapeHtml(item.description || '')}" placeholder="描述（可选）">
        <input id="editDownloadLink" value="${escapeHtml(item.link)}" placeholder="链接 *">
        <input id="editDownloadLinkText" value="${escapeHtml(item.link_text || '下载')}" placeholder="按钮文字">
      `;
      document.getElementById('editModal').style.display = 'flex';
    })
    .catch(() => showStatus('加载数据失败', 'error'));
}

function openEditProject(id) {
  editType = 'project';
  editId = id;
  document.getElementById('editModalTitle').textContent = '✏️ 编辑作品';
  
  fetch(`${API_BASE}/api/projects`)
    .then(r => r.json())
    .then(data => {
      const item = data.find(p => p.id === id);
      if (!item) { showStatus('未找到该作品', 'error'); return; }
      
      document.getElementById('editFields').innerHTML = `
        <input id="editProjectTitle" value="${escapeHtml(item.title)}" placeholder="标题 *">
        <input id="editProjectDesc" value="${escapeHtml(item.description || '')}" placeholder="描述">
        <input id="editProjectLink" value="${escapeHtml(item.link)}" placeholder="链接 *">
        <input id="editProjectImage" value="${escapeHtml(item.image || '')}" placeholder="图片URL">
        <input id="editProjectCategory" value="${escapeHtml(item.category_id || '')}" placeholder="分类ID">
      `;
      document.getElementById('editModal').style.display = 'flex';
    })
    .catch(() => showStatus('加载数据失败', 'error'));
}

async function saveEdit() {
  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }
  
  if (editType === 'download') {
    const title = document.getElementById('editDownloadTitle').value.trim();
    const link = document.getElementById('editDownloadLink').value.trim();
    if (!title || !link) { showStatus('标题和链接为必填项', 'error'); return; }
    
    const data = {
      title,
      description: document.getElementById('editDownloadDesc').value.trim(),
      link,
      link_text: document.getElementById('editDownloadLinkText').value.trim() || '下载'
    };
    
    try {
      const res = await fetch(`${API_BASE}/api/admin/downloads/${editId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        showStatus('✅ 下载项已更新');
        closeEditModal();
        loadAdminDownloads();
      } else {
        const err = await res.json();
        showStatus('❌ ' + (err.error || '更新失败'), 'error');
      }
    } catch (e) {
      showStatus('❌ 网络错误', 'error');
    }
  } else if (editType === 'project') {
    const title = document.getElementById('editProjectTitle').value.trim();
    const link = document.getElementById('editProjectLink').value.trim();
    if (!title || !link) { showStatus('标题和链接为必填项', 'error'); return; }
    
    const data = {
      title,
      description: document.getElementById('editProjectDesc').value.trim(),
      link,
      image: document.getElementById('editProjectImage').value.trim() || 'https://placehold.co/400x200?text=作品封面',
      category_id: parseInt(document.getElementById('editProjectCategory').value) || null
    };
    
    try {
      const res = await fetch(`${API_BASE}/api/admin/projects/${editId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        showStatus('✅ 作品已更新');
        closeEditModal();
        loadAdminProjects();
      } else {
        const err = await res.json();
        showStatus('❌ ' + (err.error || '更新失败'), 'error');
      }
    } catch (e) {
      showStatus('❌ 网络错误', 'error');
    }
  }
}

function closeEditModal() {
  document.getElementById('editModal').style.display = 'none';
  editId = null;
  editType = '';
}
