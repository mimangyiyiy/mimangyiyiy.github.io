<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a1a;
  color: #fff;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}
.container {
  max-width: 800px;
  margin: 0 auto;
}
h1, h2, h3 { margin-top: 0; }
.card {
  background: #1a1a2e;
  padding: 24px;
  border-radius: 16px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.08);
}
input, select, textarea {
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #2a2a4e;
  color: #fff;
  font-size: 14px;
  box-sizing: border-box;
}
input::placeholder { color: #888; }
select option { background: #2a2a4e; }
.btn {
  padding: 10px 22px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: all 0.2s;
}
.btn-primary { background: #4C97FF; color: #fff; }
.btn-primary:hover { background: #3a7be0; }
.btn-success { background: #4CAF50; color: #fff; }
.btn-success:hover { background: #3d8b40; }
.btn-danger { background: #FF6B6B; color: #fff; }
.btn-danger:hover { background: #e55a5a; }
.btn-secondary { background: #555; color: #fff; }
.btn-secondary:hover { background: #444; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.project-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #2a2a4e;
  border-radius: 10px;
  margin-bottom: 8px;
  gap: 10px;
}
.project-item .info {
  flex: 1;
  min-width: 0;
}
.project-item .info .title {
  font-weight: bold;
  display: block;
}
.project-item .info .cat-tag {
  display: inline-block;
  background: #4C97FF;
  padding: 1px 10px;
  border-radius: 12px;
  font-size: 11px;
  margin-top: 4px;
}
.project-item .actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.empty-msg {
  color: #888;
  text-align: center;
  padding: 30px;
}
#loginArea { display: block; }
#adminArea { display: none; }
.status-msg {
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
  display: none;
}
.status-msg.success { background: rgba(76, 175, 80, 0.2); color: #81C784; display: block; }
.status-msg.error { background: rgba(255, 107, 107, 0.2); color: #FF6B6B; display: block; }

.upload-area {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.upload-area input[type="file"] {
  flex: 1;
  min-width: 150px;
  padding: 8px;
  background: #2a2a4e;
  border-radius: 8px;
  border: 1px solid #333;
  color: #fff;
  margin-bottom: 0;
}
.upload-area .btn {
  flex-shrink: 0;
}
#uploadProgress {
  display: none;
  margin-top: 6px;
  font-size: 13px;
  color: #4C97FF;
}
#imagePreview {
  display: none;
  margin-top: 8px;
}
#imagePreview img {
  max-height: 120px;
  border-radius: 8px;
  border: 1px solid #333;
}
.hint {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}

/* 转移弹窗 */
#transferModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  z-index: 99999;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(5px);
}
#transferModal .modal-content {
  background: #1a1a2e;
  padding: 30px;
  border-radius: 16px;
  max-width: 450px;
  width: 90%;
  border: 1px solid #333;
}
#transferModal .modal-content h3 {
  margin-top: 0;
}
#transferModal .modal-content select {
  width: 100%;
  padding: 10px;
  margin: 15px 0;
  border-radius: 8px;
  border: 1px solid #333;
  background: #2a2a4e;
  color: #fff;
}
#transferModal .modal-content .btn-row {
  display: flex;
  gap: 10px;
}
#transferModal .modal-content .btn-row .btn {
  flex: 1;
}
</style>
</head>
<body>

<div class="container">
  <h1>📝 作品管理后台</h1>
  
  <!-- 状态消息 -->
  <div id="statusMsg" class="status-msg"></div>
  
  <!-- ===== 登录区域 ===== -->
  <div id="loginArea" class="card">
    <h2>🔐 管理员登录</h2>
    <input id="loginUser" placeholder="用户名" autocomplete="username">
    <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn btn-primary" onclick="adminLogin()" style="width:100%;">登录</button>
  </div>
  
  <!-- ===== 管理区域（登录后显示） ===== -->
  <div id="adminArea">
    <div class="header-bar">
      <h2 style="margin:0;">📋 管理作品</h2>
      <button class="btn btn-danger" onclick="logout()">退出</button>
    </div>
    
    <!-- ===== 添加分类 ===== -->
    <div class="card">
      <h3>🏷️ 管理分类</h3>
      <div style="display:flex; gap:10px; margin-bottom:15px;">
        <input id="newCategoryName" placeholder="新分类名称" style="flex:1; margin-bottom:0;">
        <button class="btn btn-success" onclick="addCategory()" style="flex-shrink:0;">添加</button>
      </div>
      <div id="categoryList">
        <div class="empty-msg">加载中...</div>
      </div>
    </div>
    
    <!-- ===== 添加作品（含图片自动上传） ===== -->
    <div class="card">
      <h3>➕ 添加作品</h3>
      <input id="newTitle" placeholder="标题 *">
      <input id="newDesc" placeholder="描述">
      
      <!-- 图片上传区域（自动上传到图床） -->
      <div style="margin-bottom:10px;">
        <label style="display:block; margin-bottom:4px; font-size:14px; color:#aaa;">📷 作品封面图片</label>
        <div class="upload-area">
          <input type="file" id="newImageFile" accept="image/*">
          <button class="btn btn-primary" onclick="uploadImageToImgBB()">上传图片</button>
        </div>
        <div id="uploadProgress">⏳ 上传中...</div>
        <div id="imagePreview">
          <img id="previewImg" src="" alt="预览">
        </div>
        <input id="newImage" placeholder="或手动输入图片URL" style="margin-top:8px;">
        <div class="hint">💡 支持 JPG / PNG / WebP / GIF，最大 32MB</div>
      </div>
      
      <input id="newLink" placeholder="作品链接 *">
      <select id="newCategory"></select>
      <button class="btn btn-success" onclick="addProject()" style="width:100%;">添加作品</button>
    </div>
    
    <!-- ===== 作品列表 ===== -->
    <div class="card">
      <h3>📋 所有作品</h3>
      <div id="projectListAdmin">
        <div class="empty-msg">加载中...</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 转移弹窗 ===== -->
<div id="transferModal">
  <div class="modal-content">
    <h3>⚠️ 分类下有作品</h3>
    <p id="transferMsg">该分类下有 <strong>0</strong> 个作品，请选择转移目标：</p>
    <select id="transferTarget"></select>
    <div class="btn-row">
      <button class="btn btn-danger" onclick="confirmDeleteCategory()">确认删除并转移</button>
      <button class="btn btn-secondary" onclick="closeTransferModal()">取消</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 1. API 配置
// ============================================================
// ⚠️ 将下面的地址替换为你的 Pages 域名（留空表示同域名）
const API_BASE = '';

// ImgBB API 密钥（免费，无需注册）
// 这是公开的演示密钥，建议你到 https://imgbb.com/api 免费获取自己的
const IMGBB_API_KEY = '2ea0509422f95d525110028825d0c25d';

// ============================================================
// 2. 工具函数
// ============================================================
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showStatus(msg, type = 'success') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
  setTimeout(() => { el.className = 'status-msg'; }, 4000);
}

function getToken() {
  return localStorage.getItem('adminToken');
}

// ============================================================
// 3. 登录 / 退出
// ============================================================
async function adminLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  
  if (!username || !password) {
    showStatus('请输入用户名和密码', 'error');
    return;
  }
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('adminToken', data.token);
      document.getElementById('loginArea').style.display = 'none';
      document.getElementById('adminArea').style.display = 'block';
      loadCategoriesWithDelete();
      loadAdminProjects();
      showStatus('✅ 登录成功');
    } else {
      const err = await res.json();
      showStatus('❌ ' + (err.error || '用户名或密码错误'), 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误，请检查后端服务', 'error');
  }
}

function logout() {
  localStorage.removeItem('adminToken');
  document.getElementById('loginArea').style.display = 'block';
  document.getElementById('adminArea').style.display = 'none';
  showStatus('已退出');
}

// ============================================================
// 4. 图片上传到 ImgBB（自动转链接）
// ============================================================
async function uploadImageToImgBB() {
  const fileInput = document.getElementById('newImageFile');
  const file = fileInput.files[0];
  
  if (!file) {
    showStatus('请先选择一张图片', 'error');
    return;
  }

  // 检查文件大小（ImgBB 最大 32MB）
  if (file.size > 32 * 1024 * 1024) {
    showStatus('图片大小不能超过 32MB', 'error');
    return;
  }

  // 检查文件类型
  const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
  if (!validTypes.includes(file.type)) {
    showStatus('仅支持 JPG、PNG、WebP、GIF 格式', 'error');
    return;
  }

  // 显示上传进度
  const progressEl = document.getElementById('uploadProgress');
  progressEl.style.display = 'block';
  progressEl.textContent = '⏳ 上传到图床...';

  try {
    // 将图片转为 Base64
    const base64 = await fileToBase64(file);
    
    // 调用 ImgBB API
    const formData = new FormData();
    formData.append('key', IMGBB_API_KEY);
    formData.append('image', base64.split(',')[1]); // 去掉 data:image/xxx;base64, 前缀
    formData.append('name', file.name);

    const response = await fetch('https://api.imgbb.com/1/upload', {
      method: 'POST',
      body: formData
    });

    const data = await response.json();

    if (data.success) {
      // 获取图片链接
      const imageUrl = data.data.url;
      
      // 自动填入输入框
      document.getElementById('newImage').value = imageUrl;
      
      // 显示预览
      const preview = document.getElementById('imagePreview');
      const previewImg = document.getElementById('previewImg');
      previewImg.src = imageUrl;
      preview.style.display = 'block';
      
      showStatus('✅ 图片上传成功！');
      progressEl.textContent = '✅ 上传完成';
    } else {
      showStatus('❌ 图床上传失败：' + (data.error?.message || '未知错误'), 'error');
      progressEl.style.display = 'none';
    }
  } catch (e) {
    showStatus('❌ 上传失败：' + e.message, 'error');
    progressEl.style.display = 'none';
  }

  setTimeout(() => {
    progressEl.style.display = 'none';
  }, 3000);
}

// 工具函数：File 转 Base64
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// 选择文件后自动预览
document.addEventListener('DOMContentLoaded', function() {
  const fileInput = document.getElementById('newImageFile');
  if (fileInput) {
    fileInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById('imagePreview');
          const previewImg = document.getElementById('previewImg');
          previewImg.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });
  }
});

// ============================================================
// 5. 分类管理（含删除 + 转移）
// ============================================================
let deletingCategoryId = null;

async function loadCategories() {
  try {
    const res = await fetch(`${API_BASE}/api/categories`);
    if (!res.ok) throw new Error();
    const categories = await res.json();
    const select = document.getElementById('newCategory');
    select.innerHTML = categories.map(c => 
      `<option value="${c.id}">${escapeHtml(c.name)}</option>`
    ).join('');
    return categories;
  } catch (e) {
    console.error('加载分类失败', e);
    return [];
  }
}

async function loadCategoriesWithDelete() {
  try {
    const res = await fetch(`${API_BASE}/api/categories`);
    if (!res.ok) throw new Error();
    const categories = await res.json();
    
    const select = document.getElementById('newCategory');
    select.innerHTML = categories.map(c => 
      `<option value="${c.id}">${escapeHtml(c.name)}</option>`
    ).join('');
    
    const container = document.getElementById('categoryList');
    if (categories.length === 0) {
      container.innerHTML = '<div class="empty-msg">暂无分类</div>';
      return;
    }
    
    container.innerHTML = categories.map(c => `
      <div class="project-item">
        <span>${escapeHtml(c.name)}</span>
        <button class="btn btn-danger btn-sm" onclick="deleteCategoryWithCheck(${c.id})">删除</button>
      </div>
    `).join('');
    
    return categories;
  } catch (e) {
    document.getElementById('categoryList').innerHTML = '<div class="empty-msg">❌ 加载失败</div>';
    return [];
  }
}

async function addCategory() {
  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }
  
  const name = document.getElementById('newCategoryName').value.trim();
  if (!name) { showStatus('请输入分类名称', 'error'); return; }
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/categories`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ name })
    });
    
    if (res.ok) {
      showStatus('✅ 分类添加成功');
      document.getElementById('newCategoryName').value = '';
      loadCategoriesWithDelete();
    } else {
      const err = await res.json();
      showStatus('❌ ' + (err.error || '添加失败'), 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

async function deleteCategoryWithCheck(categoryId) {
  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/categories/${categoryId}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({})
    });
    
    if (res.ok) {
      showStatus('✅ 分类已删除');
      loadCategoriesWithDelete();
    } else {
      const data = await res.json();
      
      if (data.hasProjects) {
        deletingCategoryId = categoryId;
        document.getElementById('transferMsg').innerHTML = 
          `该分类下有 <strong>${data.projectCount}</strong> 个作品，请选择转移目标：`;
        
        const select = document.getElementById('transferTarget');
        select.innerHTML = data.availableCategories.map(c => 
          `<option value="${c.id}">${escapeHtml(c.name)}</option>`
        ).join('');
        
        if (data.availableCategories.length === 0) {
          select.innerHTML = '<option value="">⚠️ 请先创建其他分类</option>';
          select.disabled = true;
        } else {
          select.disabled = false;
        }
        
        document.getElementById('transferModal').style.display = 'flex';
      } else {
        showStatus('❌ ' + (data.error || '删除失败'), 'error');
      }
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

async function confirmDeleteCategory() {
  const token = getToken();
  if (!token) return;
  
  const targetId = document.getElementById('transferTarget').value;
  if (!targetId) {
    showStatus('请选择目标分类', 'error');
    return;
  }
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/categories/${deletingCategoryId}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ transferToId: parseInt(targetId) })
    });
    
    if (res.ok) {
      showStatus('✅ 分类已删除，作品已转移');
      closeTransferModal();
      loadCategoriesWithDelete();
      loadAdminProjects();
    } else {
      const data = await res.json();
      showStatus('❌ ' + (data.error || '删除失败'), 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

function closeTransferModal() {
  document.getElementById('transferModal').style.display = 'none';
  deletingCategoryId = null;
}

// ============================================================
// 6. 作品管理
// ============================================================
async function loadAdminProjects() {
  const token = getToken();
  if (!token) return;
  
  try {
    const res = await fetch(`${API_BASE}/api/projects`);
    if (!res.ok) throw new Error();
    const projects = await res.json();
    
    const container = document.getElementById('projectListAdmin');
    if (projects.length === 0) {
      container.innerHTML = '<div class="empty-msg">暂无作品</div>';
      return;
    }
    
    container.innerHTML = projects.map(p => `
      <div class="project-item">
        <div class="info">
          <span class="title">${escapeHtml(p.title)}</span>
          <span class="cat-tag">${escapeHtml(p.category_name || '未分类')}</span>
        </div>
        <div class="actions">
          <button class="btn btn-danger btn-sm" onclick="deleteProject(${p.id})">删除</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('projectListAdmin').innerHTML = '<div class="empty-msg">❌ 加载失败</div>';
  }
}

async function addProject() {
  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }
  
  const title = document.getElementById('newTitle').value.trim();
  const link = document.getElementById('newLink').value.trim();
  const categoryId = document.getElementById('newCategory').value;
  
  if (!title || !link) {
    showStatus('标题和链接为必填项', 'error');
    return;
  }
  
  const data = {
    title,
    description: document.getElementById('newDesc').value.trim(),
    image: document.getElementById('newImage').value.trim() || 'https://placehold.co/400x200?text=作品封面',
    link,
    category_id: parseInt(categoryId) || null
  };
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/projects`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify(data)
    });
    
    if (res.ok) {
      showStatus('✅ 添加成功！');
      document.getElementById('newTitle').value = '';
      document.getElementById('newDesc').value = '';
      document.getElementById('newImage').value = '';
      document.getElementById('newLink').value = '';
      document.getElementById('imagePreview').style.display = 'none';
      document.getElementById('newImageFile').value = '';
      loadAdminProjects();
    } else {
      const err = await res.json();
      showStatus('❌ ' + (err.error || '添加失败'), 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

async function deleteProject(id) {
  if (!confirm('确定要删除这个作品吗？')) return;
  
  const token = getToken();
  try {
    const res = await fetch(`${API_BASE}/api/admin/projects/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    
    if (res.ok) {
      showStatus('✅ 已删除');
      loadAdminProjects();
    } else {
      showStatus('❌ 删除失败', 'error');
    }
  } catch (e) {
    showStatus('❌ 网络错误', 'error');
  }
}

// ============================================================
// 7. 检查登录状态
// ============================================================
function checkAuth() {
  const token = getToken();
  if (token) {
    document.getElementById('loginArea').style.display = 'none';
    document.getElementById('adminArea').style.display = 'block';
    loadCategoriesWithDelete();
    loadAdminProjects();
  }
}

// ============================================================
// 8. 页面启动
// ============================================================
checkAuth();
console.log('🔐 管理后台已加载');
</script>
</body>
</html>
