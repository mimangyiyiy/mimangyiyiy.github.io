<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a1a;
  color: #fff;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}
.container {
  max-width: 800px;
  margin: 0 auto;
}
h1, h2, h3 { margin-top: 0; }
.card {
  background: #1a1a2e;
  padding: 24px;
  border-radius: 16px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.08);
}
input, select, textarea {
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #2a2a4e;
  color: #fff;
  font-size: 14px;
  box-sizing: border-box;
}
input::placeholder { color: #888; }
select option { background: #2a2a4e; }
.btn {
  padding: 10px 22px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: all 0.2s;
}
.btn-primary { background: #4C97FF; color: #fff; }
.btn-primary:hover { background: #3a7be0; }
.btn-success { background: #4CAF50; color: #fff; }
.btn-success:hover { background: #3d8b40; }
.btn-danger { background: #FF6B6B; color: #fff; }
.btn-danger:hover { background: #e55a5a; }
.btn-secondary { background: #555; color: #fff; }
.btn-secondary:hover { background: #444; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.project-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #2a2a4e;
  border-radius: 10px;
  margin-bottom: 8px;
  gap: 10px;
}
.project-item .info {
  flex: 1;
  min-width: 0;
}
.project-item .info .title {
  font-weight: bold;
  display: block;
}
.project-item .info .cat-tag {
  display: inline-block;
  background: #4C97FF;
  padding: 1px 10px;
  border-radius: 12px;
  font-size: 11px;
  margin-top: 4px;
}
.project-item .actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.empty-msg {
  color: #888;
  text-align: center;
  padding: 30px;
}
#loginArea { display: block; }
#adminArea { display: none; }
.status-msg {
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
  display: none;
}
.status-msg.success { background: rgba(76, 175, 80, 0.2); color: #81C784; display: block; }
.status-msg.error { background: rgba(255, 107, 107, 0.2); color: #FF6B6B; display: block; }
</style>
</head>
<body>

<div class="container">
  <h1>📝 作品管理后台</h1>
  
  <!-- 状态消息 -->
  <div id="statusMsg" class="status-msg"></div>
  
  <!-- ===== 登录区域 ===== -->
  <div id="loginArea" class="card">
    <h2>🔐 管理员登录</h2>
    <input id="loginUser" placeholder="用户名" autocomplete="username">
    <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn btn-primary" onclick="adminLogin()" style="width:100%;">登录</button>
  </div>
  
  <!-- ===== 管理区域（登录后显示） ===== -->
  <div id="adminArea">
    <div class="header-bar">
      <h2 style="margin:0;">📋 管理作品</h2>
      <button class="btn btn-danger" onclick="logout()">退出</button>
    </div>
    
    <!-- 添加分类 -->
    <div class="card">
      <h3>🏷️ 添加分类</h3>
      <div style="display:flex; gap:10px;">
        <input id="newCategoryName" placeholder="分类名称（如：Unity作品）" style="flex:1; margin-bottom:0;">
        <button class="btn btn-success" onclick="addCategory()" style="flex-shrink:0;">添加</button>
      </div>
    </div>
    
    <!-- 添加作品 -->
    <div class="card">
      <h3>➕ 添加作品</
