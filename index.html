<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>我的作品集</title>

<style>
/* ================= 基础变量 ================= */
:root {
  --blue: #4C97FF;
  --orange: #FFAB19;
}

/* ================= Body ================= */
body {
  margin: 0;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  color: #ffffff;
  position: relative;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  background-image: url('https://ts1.tc.mm.bing.net/th/id/R-C.b0ea268fa1be279d112489ce83ad4696?rik=qItsh%2fBiy33hlg&riu=http%3a%2f%2fwww.quazero.com%2fuploads%2fallimg%2f140303%2f1-140303215009.jpg&ehk=S6PLWamt%2bMzQV8uO9ugcU5d5M19BpXtCpNz2cRJ7q9M%3d&risl=&pid=ImgRaw&r=0');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.4);
  pointer-events: none;
  z-index: 0;
}

header, .container, .download-float, .glass-toggle {
  position: relative;
  z-index: 2;
}

/* ===== 关闭毛玻璃模式 ===== */
body.glass-off {
  color: #000 !important;
  background-image: none !important;
  background-color: #f5f5f7 !important;
}
body.glass-off::before { display: none !important; }
body.glass-off .glass,
body.glass-off .project-card,
body.glass-off .download-panel,
body.glass-off .download-trigger,
body.glass-off .glass-toggle,
body.glass-off header {
  background: #ffffff !important;
  backdrop-filter: none !important;
  border: 1px solid #e0e0e0 !important;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06) !important;
  color: #000 !important;
}
body.glass-off .project-card h3,
body.glass-off .project-card p,
body.glass-off .project-card .btn { color: #000 !important; }
body.glass-off .project-card .btn { background: #4C97FF !important; color: #fff !important; }
body.glass-off .section-title,
body.glass-off header h1,
body.glass-off header p { color: #000 !important; text-shadow: none !important; }
body.glass-off .download-panel h4,
body.glass-off .download-item { color: #000 !important; }
body.glass-off .download-trigger svg,
body.glass-off .glass-toggle svg { fill: #000 !important; }
body.glass-off .refraction-edge { display: none !important; }
body.glass-off .ripple { display: none !important; }

/* ================= 毛玻璃 ================= */
.glass {
  background: rgba(30, 35, 65, 0.35);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
}

/* ===== 卡片：光学边缘折射 ===== */
.project-card {
  position: relative;
  padding: 1.5rem;
  text-align: center;
  border-radius: 24px;
  background: rgba(25, 30, 55, 0.2);
  backdrop-filter: blur(12px) saturate(1.1);
  -webkit-backdrop-filter: blur(12px) saturate(1.1);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  color: white;
  transition: box-shadow 0.3s ease;
  transform-style: preserve-3d;
  will-change: transform;
  cursor: default;
  overflow: visible !important;
  isolation: isolate;
}

.project-card:hover {
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
}

/* ===== 边缘折射层 ===== */
.project-card .refraction-edge {
  position: absolute;
  inset: -6px;
  border-radius: 28px;
  pointer-events: none;
  z-index: 0;
  background: transparent;
  backdrop-filter: blur(2px) brightness(1.02);
  -webkit-backdrop-filter: blur(2px) brightness(1.02);
  transition: backdrop-filter 0.15s ease;
  will-change: transform, backdrop-filter;
  /* 边缘折射光晕 */
  box-shadow: 
    inset 0 0 30px rgba(255, 255, 255, 0.02),
    0 0 20px rgba(100, 150, 255, 0.01);
}

/* 鼠标悬浮时折射增强 */
.project-card.refracting .refraction-edge {
  backdrop-filter: blur(3px) brightness(1.04) hue-rotate(2deg);
  -webkit-backdrop-filter: blur(3px) brightness(1.04) hue-rotate(2deg);
  box-shadow: 
    inset 0 0 40px rgba(255, 255, 255, 0.04),
    0 0 30px rgba(100, 150, 255, 0.03);
}

/* 边缘折射光晕 - 彩色偏移 */
.project-card .refraction-edge::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 30px;
  background: radial-gradient(
    ellipse at 50% 50%,
    rgba(120, 180, 255, 0.02) 0%,
    rgba(180, 120, 255, 0.01) 40%,
    transparent 70%
  );
  pointer-events: none;
  transition: all 0.2s ease;
}

.project-card.refracting .refraction-edge::before {
  background: radial-gradient(
    ellipse at var(--rx, 50%) var(--ry, 50%),
    rgba(120, 200, 255, 0.06) 0%,
    rgba(180, 120, 255, 0.04) 30%,
    rgba(255, 200, 100, 0.02) 60%,
    transparent 80%
  );
}

/* ===== 液态光晕 ===== */
.project-card .glass-glow {
  position: absolute;
  inset: 0;
  border-radius: 24px;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(circle at 50% 50%, 
    rgba(255, 255, 255, 0.04) 0%, 
    transparent 60%
  );
  transition: background 0.1s ease;
}

.project-card > *:not(.refraction-edge):not(.glass-glow) {
  position: relative;
  z-index: 2;
}

.project-image {
  height: 150px;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 1rem;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
  transform: translateZ(8px);
}

.project-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
  pointer-events: none;
}

.project-card:hover .project-image img {
  transform: scale(1.03);
}

.project-card h3 {
  margin: 0.5rem 0 0.2rem;
  font-size: 1.2rem;
  transform: translateZ(12px);
  font-weight: 500;
}

.project-card p {
  margin: 0.2rem 0 0.8rem;
  font-size: 0.85rem;
  opacity: 0.7;
  transform: translateZ(8px);
  line-height: 1.4;
}

.project-card .btn {
  display: inline-block;
  padding: 0.5rem 1.4rem;
  border-radius: 50px;
  font-weight: 500;
  text-decoration: none;
  background: rgba(76, 151, 255, 0.8);
  backdrop-filter: blur(4px);
  color: white;
  transition: all 0.25s ease;
  border: 1px solid rgba(255, 255, 255, 0.1);
  cursor: pointer;
  font-size: 0.85rem;
  transform: translateZ(16px);
}

.project-card .btn:hover {
  background: #4C97FF;
  transform: translateZ(20px) scale(1.03);
  border-color: rgba(255, 255, 255, 0.2);
}

/* ===== 控件 ===== */
.glass-toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 9999;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(30, 35, 65, 0.4);
  backdrop-filter: blur(12px);
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
}
.glass-toggle svg { width: 22px; height: 22px; fill: white; }

.download-float {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 9999;
}
.download-trigger {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(30, 35, 65, 0.4);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
}
.download-trigger svg { width: 24px; height: 24px; fill: white; }

.download-panel {
  position: absolute;
  right: 0;
  bottom: 70px;
  width: 280px;
  padding: 16px;
  display: none;
  backdrop-filter: blur(20px);
  background: rgba(25, 30, 55, 0.7);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.06);
  max-height: 400px;
  overflow-y: auto;
}
.download-panel h4 {
  margin-top: 0;
  margin-bottom: 12px;
  color: white;
  font-weight: 400;
}
.download-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 14px;
  margin-bottom: 6px;
  color: white;
  background: rgba(255,255,255,0.03);
}
.download-item .info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.download-item .info .title { font-weight: 500; font-size: 13px; }
.download-item .info .desc { font-size: 11px; opacity: 0.5; }
.download-item a {
  padding: 4px 14px;
  background: var(--blue);
  color: white;
  border-radius: 20px;
  text-decoration: none;
  font-size: 12px;
  flex-shrink: 0;
  margin-left: 8px;
}
.download-mask {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 9998;
  display: none;
}

header {
  text-align: center;
  padding: 2rem 1rem;
  background: linear-gradient(135deg, rgba(50, 80, 180, 0.3), rgba(80, 60, 140, 0.3));
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
header h1 {
  color: white;
  text-shadow: 0 2px 20px rgba(0,0,0,0.2);
  margin: 0;
  font-size: 1.8rem;
  font-weight: 500;
}
header p {
  color: rgba(255,255,255,0.4);
  margin: 0.2rem 0 0;
  font-size: 0.8rem;
}

#projectContainer {
  max-width: 1200px;
  margin: 2rem auto;
  padding: 0 1rem;
}
.section-title {
  font-size: 1.3rem;
  border-left: 3px solid var(--orange);
  padding-left: 12px;
  margin-bottom: 0.4rem;
  color: white;
  font-weight: 400;
  text-shadow: 0 1px 20px rgba(0,0,0,0.1);
}
.project-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.8rem;
  perspective: 1200px;
  margin-bottom: 2rem;
}
.loading-placeholder {
  text-align: center;
  padding: 40px;
  color: rgba(255,255,255,0.3);
  font-size: 16px;
}

.ripple {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 10000;
  transform: translate(-50%, -50%);
  animation: rippleAnim 1s ease-out forwards;
}
body.glass-on .ripple { border: 2px solid rgba(100, 150, 255, 0.3); }
@keyframes rippleAnim {
  from { width: 32px; height: 32px; opacity: 1; }
  to { width: 140px; height: 140px; opacity: 0; }
}

@media (max-width: 768px) {
  .project-list { gap: 1.25rem; }
  .download-panel { width: 240px; right: 0; }
  header h1 { font-size: 1.4rem; }
  .project-card { padding: 1rem; }
}
</style>
</head>

<body class="glass-on">

<div class="glass-toggle" id="glassToggle">
  <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h11v2zm0-4H6V7h11v2z"/></svg>
</div>

<header class="glass">
  <h1>作品集</h1>
</header>

<div id="projectContainer">
  <div class="loading-placeholder">⏳ 加载中...</div>
</div>

<div class="download-mask" id="mask"></div>
<div class="download-float">
  <button class="download-trigger glass" id="downloadBtn">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
  </button>
  <div class="download-panel glass" id="panel">
    <h4>下载</h4>
    <div id="downloadList"><div style="color:rgba(255,255,255,0.3); text-align:center; padding:10px;">加载中...</div></div>
  </div>
</div>

<script>
// ============================================================
// 1. API 配置
// ============================================================
const API_BASE = '';

// ============================================================
// 2. 工具函数
// ============================================================
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
// 3. 加载并渲染作品
// ============================================================
async function loadProjects() {
  const container = document.getElementById('projectContainer');
  if (!container) return;
  container.innerHTML = '<div class="loading-placeholder">⏳ 加载中...</div>';
  
  try {
    const res = await fetch(`${API_BASE}/api/projects`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const projects = await res.json();
    renderProjects(projects, container);
  } catch (e) {
    console.error('加载作品失败:', e);
    container.innerHTML = `<div style="color:#FF6B6B; text-align:center; padding:40px;">⚠️ 加载失败</div>`;
  }
}

function renderProjects(projects, container) {
  const groups = {};
  projects.forEach(p => {
    const catName = p.category_name || '未分类';
    if (!groups[catName]) groups[catName] = [];
    groups[catName].push(p);
  });

  const categoryNames = Object.keys(groups);
  container.innerHTML = '';

  if (categoryNames.length === 0) {
    container.innerHTML = `<div style="color:rgba(255,255,255,0.3); text-align:center; padding:40px;">暂无作品</div>`;
    return;
  }

  categoryNames.forEach(catName => {
    const projectsInCat = groups[catName];
    const section = document.createElement('div');
    section.className = 'container';
    section.style.maxWidth = '1200px';
    section.style.margin = '0 auto 2rem auto';
    section.style.padding = '0 1rem';
    
    const title = document.createElement('h2');
    title.className = 'section-title';
    title.textContent = catName;
    section.appendChild(title);
    
    const list = document.createElement('div');
    list.className = 'project-list';
    list.innerHTML = projectsInCat.map(p => `
      <div class="project-card" data-tilt>
        <div class="refraction-edge"></div>
        <div class="glass-glow"></div>
        <div class="project-image">
          <img src="${p.image || 'https://placehold.co/400x200?text=No+Image'}" alt="${p.title}" loading="lazy" onerror="this.src='https://placehold.co/400x200?text=加载失败'">
        </div>
        <h3>${escapeHtml(p.title)}</h3>
        <p>${escapeHtml(p.description || '')}</p>
        <a href="${escapeHtml(p.link)}" class="btn" target="_blank">查看</a>
      </div>
    `).join('');
    
    section.appendChild(list);
    container.appendChild(section);
  });

  bindCardEffects();
}

// ============================================================
// 4. ✨ 光学边缘折射 + 液态玻璃
// ============================================================
function bindCardEffects() {
  const cards = document.querySelectorAll('.project-card[data-tilt]');
  
  cards.forEach(card => {
    const refractionEdge = card.querySelector('.refraction-edge');
    const glassGlow = card.querySelector('.glass-glow');
    
    let rafId = null;
    let currentRotateX = 0, targetRotateX = 0;
    let currentRotateY = 0, targetRotateY = 0;
    let currentScaleX = 1, targetScaleX = 1;
    let currentScaleY = 1, targetScaleY = 1;
    let currentTranslateX = 0, targetTranslateX = 0;
    let currentTranslateY = 0, targetTranslateY = 0;
    let currentRefX = 0, targetRefX = 0;
    let currentRefY = 0, targetRefY = 0;
    
    function animate() {
      const ease = 0.10;
      
      currentRotateX += (targetRotateX - currentRotateX) * ease;
      currentRotateY += (targetRotateY - currentRotateY) * ease;
      currentScaleX += (targetScaleX - currentScaleX) * ease;
      currentScaleY += (targetScaleY - currentScaleY) * ease;
      currentTranslateX += (targetTranslateX - currentTranslateX) * ease;
      currentTranslateY += (targetTranslateY - currentTranslateY) * ease;
      currentRefX += (targetRefX - currentRefX) * ease;
      currentRefY += (targetRefY - currentRefY) * ease;
      
      // 卡片变换
      card.style.transform = `
        perspective(900px) 
        rotateX(${currentRotateX * 0.5}deg) 
        rotateY(${currentRotateY * 0.5}deg) 
        scale(${currentScaleX}, ${currentScaleY}) 
        translateX(${currentTranslateX * 0.3}px) 
        translateY(${currentTranslateY * 0.3}px)
      `;
      
      // 边缘折射层
      if (refractionEdge) {
        const refIntensity = Math.min(Math.abs(currentScaleX - 1) + Math.abs(currentScaleY - 1), 0.04);
        const blurAmount = 2 + refIntensity * 30;
        const brightness = 1.02 + refIntensity * 0.3;
        const shiftX = currentRefX * 8;
        const shiftY = currentRefY * 8;
        
        refractionEdge.style.transform = `translate(${shiftX}px, ${shiftY}px)`;
        refractionEdge.style.backdropFilter = `blur(${blurAmount}px) brightness(${brightness})`;
        refractionEdge.style.webkitBackdropFilter = `blur(${blurAmount}px) brightness(${brightness})`;
        
        // 彩色偏移
        const hue = 220 + currentRefX * 20;
        refractionEdge.style.boxShadow = `
          inset 0 0 40px rgba(255, 255, 255, ${0.02 + refIntensity * 0.5}),
          0 0 30px hsla(${hue}, 80%, 60%, ${0.01 + refIntensity * 0.3})
        `;
        
        // 折射光晕位置
        const rx = 50 + currentRefX * 20;
        const ry = 50 + currentRefY * 20;
        refractionEdge.style.setProperty('--rx', rx + '%');
        refractionEdge.style.setProperty('--ry', ry + '%');
      }
      
      // 液态光晕
      if (glassGlow) {
        const gx = 50 + (currentTranslateX / 20) * 25;
        const gy = 50 + (currentTranslateY / 20) * 25;
        const intensity = 0.04 + Math.min(Math.abs(currentScaleX - 1) + Math.abs(currentScaleY - 1), 0.03);
        glassGlow.style.background = `
          radial-gradient(circle at ${gx}% ${gy}%, 
            rgba(255,255,255,${intensity}) 0%, 
            rgba(255,255,255,${intensity * 0.3}) 30%, 
            transparent 70%
          )
        `;
      }
      
      rafId = requestAnimationFrame(animate);
    }
    
    if (!card._animStarted) {
      card._animStarted = true;
      animate();
    }
    
    function tiltHandler(e) {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      const dx = (x - 0.5) * 2;
      const dy = (y - 0.5) * 2;
      
      targetRotateX = -dy * 12;
      targetRotateY = dx * 12;
      targetScaleX = Math.max(0.92, Math.min(1.08, 1 + dx * 0.04));
      targetScaleY = Math.max(0.92, Math.min(1.08, 1 + dy * 0.04));
      targetTranslateX = dx * 18;
      targetTranslateY = dy * 18;
      targetRefX = dx * 0.8;
      targetRefY = dy * 0.8;
      
      card.classList.add('refracting');
    }
    
    function resetHandler() {
      targetRotateX = 0;
      targetRotateY = 0;
      targetScaleX = 1;
      targetScaleY = 1;
      targetTranslateX = 0;
      targetTranslateY = 0;
      targetRefX = 0;
      targetRefY = 0;
      card.classList.remove('refracting');
      
      if (refractionEdge) {
        refractionEdge.style.transform = 'translate(0, 0)';
        refractionEdge.style.backdropFilter = 'blur(2px) brightness(1.02)';
        refractionEdge.style.webkitBackdropFilter = 'blur(2px) brightness(1.02)';
        refractionEdge.style.boxShadow = 'inset 0 0 30px rgba(255,255,255,0.02), 0 0 20px rgba(100,150,255,0.01)';
      }
      if (glassGlow) {
        glassGlow.style.background = 'radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04) 0%, transparent 60%)';
      }
    }
    
    card.addEventListener('mousemove', tiltHandler);
    card.addEventListener('mouseleave', resetHandler);
    
    card._cleanup = () => {
      if (rafId) cancelAnimationFrame(rafId);
      card.removeEventListener('mousemove', tiltHandler);
      card.removeEventListener('mouseleave', resetHandler);
    };
  });
}

// ============================================================
// 5. 下载加载
// ============================================================
async function loadDownloads() {
  const container = document.getElementById('downloadList');
  if (!container) return;
  try {
    const res = await fetch(`${API_BASE}/api/downloads`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const downloads = await res.json();
    if (downloads.length === 0) {
      container.innerHTML = `<div style="color:rgba(255,255,255,0.3); text-align:center; padding:10px;">暂无</div>`;
      return;
    }
    container.innerHTML = downloads.map(item => `
      <div class="download-item">
        <div class="info">
          <span class="title">${escapeHtml(item.title)}</span>
          ${item.description ? `<span class="desc">${escapeHtml(item.description)}</span>` : ''}
        </div>
        <a href="${escapeHtml(item.link)}" target="_blank">${escapeHtml(item.link_text || '下载')}</a>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = `<div style="color:#FF6B6B; text-align:center; padding:10px;">⚠️ 加载失败</div>`;
  }
}

// ============================================================
// 6. 控件
// ============================================================
document.getElementById('glassToggle').onclick = () => {
  document.body.classList.toggle('glass-on');
  document.body.classList.toggle('glass-off');
};

const btn = document.getElementById('downloadBtn');
const panel = document.getElementById('panel');
const mask = document.getElementById('mask');

btn.onclick = () => {
  const show = panel.style.display === 'block';
  panel.style.display = show ? 'none' : 'block';
  mask.style.display = show ? 'none' : 'block';
  if (!show) loadDownloads();
};

mask.onclick = () => {
  panel.style.display = 'none';
  mask.style.display = 'none';
};

document.addEventListener('mousedown', e => {
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  ripple.style.left = e.clientX + 'px';
  ripple.style.top = e.clientY + 'px';
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 1000);
});
