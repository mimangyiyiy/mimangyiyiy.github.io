<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>必应搜索导航主页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* 头部区域 */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        /* 必应搜索区域 - 突出显示 */
        .bing-search-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid #00809d;
        }
        
        .bing-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .bing-logo h2 {
            color: #00809d;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .bing-icon {
            font-size: 2.5rem;
        }
        
        /* 搜索框样式 */
        .search-form {
            display: flex;
            max-width: 600px;
            margin: 0 auto 20px;
        }
        
        .search-input {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid #00809d;
            border-right: none;
            border-radius: 10px 0 0 10px;
            outline: none;
        }
        
        .search-btn {
            background: #00809d;
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 0 10px 10px 0;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .search-btn:hover {
            background: #006a87;
        }
        
        /* 搜索引擎切换 */
        .engine-switch {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .engine-btn {
            padding: 8px 20px;
            border: 2px solid #00809d;
            background: white;
            color: #00809d;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .engine-btn.active {
            background: #00809d;
            color: white;
        }
        
        .engine-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        /* 网站卡片区域 */
        .sites-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .section-title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        
        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }
        
        /* 网站卡片 */
        .site-card {
            background: white;
            border-radius: 15px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid transparent;
        }
        
        .site-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .site-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
        }
        
        .site-name {
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        /* 卡片颜色主题 */
        .card-bilibili:hover { border-color: #fb7299; background: linear-gradient(135deg, #fff5f8, white); }
        .card-xiaohongshu:hover { border-color: #ff2442; background: linear-gradient(135deg, #fff5f8, white); }
        .card-douyin:hover { border-color: #000; background: linear-gradient(135deg, #f5f5f5, white); }
        .card-bing:hover { border-color: #00809d; background: linear-gradient(135deg, #f0f8ff, white); }
        .card-zhihu:hover { border-color: #0066ff; background: linear-gradient(135deg, #f0f8ff, white); }
        .card-weibo:hover { border-color: #e6162d; background: linear-gradient(135deg, #fff5f5, white); }
        .card-baidu:hover { border-color: #2932e1; background: linear-gradient(135deg, #f0f8ff, white); }
        .card-github:hover { border-color: #24292e; background: linear-gradient(135deg, #f6f8fa, white); }
        .card-google:hover { border-color: #4285f4; background: linear-gradient(135deg, #f0f8ff, white); }
        .card-youtube:hover { border-color: #ff0000; background: linear-gradient(135deg, #fff5f5, white); }
        
        /* 底部信息 */
        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            opacity: 0.8;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .sites-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 15px;
            }
            
            .search-form {
                flex-direction: column;
            }
            
            .search-input {
                border-radius: 10px 10px 0 0;
                border-right: 2px solid #00809d;
                border-bottom: none;
            }
            
            .search-btn {
                border-radius: 0 0 10px 10px;
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .bing-search-section,
            .sites-section {
                padding: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .sites-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .engine-switch {
                flex-direction: column;
                align-items: center;
            }
            
            .engine-btn {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🌐 智能导航主页</h1>
            <p>点击卡片在当前页面打开 | 必应搜索为核心功能</p>
        </div>
        
        <!-- 必应搜索区域 -->
        <div class="bing-search-section">
            <div class="bing-logo">
                <h2>
                    <span class="bing-icon">🔍</span>
                    必应搜索
                </h2>
            </div>
            
            <form class="search-form" onsubmit="return handleSearch()">
                <input type="text" 
                       id="search-input" 
                       class="search-input" 
                       placeholder="在必应中搜索..." 
                       autocomplete="off"
                       autofocus>
                <button type="submit" class="search-btn">搜索</button>
            </form>
            
            <div class="engine-switch">
                <button class="engine-btn active" onclick="setEngine('bing')">必应搜索</button>
                <button class="engine-btn" onclick="setEngine('baidu')">百度搜索</button>
                <button class="engine-btn" onclick="setEngine('google')">谷歌搜索</button>
            </div>
        </div>
        
        <!-- 网站卡片区域 -->
        <div class="sites-section">
            <h2 class="section-title">常用网站导航</h2>
            
            <div class="sites-grid">
                <!-- 第1行 -->
                <a href="https://www.bilibili.com" class="site-card card-bilibili">
                    <span class="site-icon">📺</span>
                    <div class="site-name">哔哩哔哩</div>
                </a>
                
                <a href="https://www.xiaohongshu.com" class="site-card card-xiaohongshu">
                    <span class="site-icon">📕</span>
                    <div class="site-name">小红书</div>
                </a>
                
                <a href="https://www.douyin.com" class="site-card card-douyin">
                    <span class="site-icon">🎵</span>
                    <div class="site-name">抖音</div>
                </a>
                
                <a href="https://cn.bing.com" class="site-card card-bing">
                    <span class="site-icon">🔍</span>
                    <div class="site-name">必应搜索</div>
                </a>
                
                <a href="https://www.zhihu.com" class="site-card card-zhihu">
                    <span class="site-icon">❓</span>
                    <div class="site-name">知乎</div>
                </a>
                
                <!-- 第2行 -->
                <a href="https://weibo.com" class="site-card card-weibo">
                    <span class="site-icon">💬</span>
                    <div class="site-name">微博</div>
                </a>
                
                <a href="https://www.baidu.com" class="site-card card-baidu">
                    <span class="site-icon">🔎</span>
                    <div class="site-name">百度</div>
                </a>
                
                <a href="https://github.com" class="site-card card-github">
                    <span class="site-icon">💻</span>
                    <div class="site-name">GitHub</div>
                </a>
                
                <a href="https://www.google.com" class="site-card card-google">
                    <span class="site-icon">🌍</span>
                    <div class="site-name">Google</div>
                </a>
                
                <a href="https://www.youtube.com" class="site-card card-youtube">
                    <span class="site-icon">📹</span>
                    <div class="site-name">YouTube</div>
                </a>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 智能导航主页 | 所有链接在当前页面打开 | 核心：必应搜索</p>
        </div>
    </div>
    
    <script>
        // 当前搜索引擎
        let currentEngine = 'bing';
        
        // 搜索引擎配置
        const engines = {
            'bing': {
                name: '必应',
                url: 'https://cn.bing.com/search?q=',
                active: true
            },
            'baidu': {
                name: '百度',
                url: 'https://www.baidu.com/s?wd=',
                active: false
            },
            'google': {
                name: '谷歌',
                url: 'https://www.google.com/search?q=',
                active: false
            }
        };
        
        // 设置搜索引擎
        function setEngine(engine) {
            currentEngine = engine;
            
            // 更新按钮状态
            document.querySelectorAll('.engine-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新搜索框提示
            const searchInput = document.getElementById('search-input');
            searchInput.placeholder = `在${engines[engine].name}中搜索...`;
            
            // 聚焦到搜索框
            searchInput.focus();
        }
        
        // 处理搜索
        function handleSearch() {
            const keyword = document.getElementById('search-input').value.trim();
            if (keyword) {
                // 在当前页面打开搜索结果
                window.location.href = engines[currentEngine].url + encodeURIComponent(keyword);
            }
            return false;
        }
        
        // 为搜索框添加回车键搜索
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
        
        // 页面加载时自动聚焦到搜索框
        window.onload = function() {
            document.getElementById('search-input').focus();
        };
        
        // 为所有网站卡片添加点击处理（可选，这里主要依赖href在当前页面打开）
        document.querySelectorAll('.site-card').forEach(card => {
            card.addEventListener('click', function() {
                // 添加点击反馈效果
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });
    </script>
</body>
</html>
