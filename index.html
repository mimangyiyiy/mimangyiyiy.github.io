<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>我的作品集 | 动态管理版</title>

<style>
/* ================= 基础变量 ================= */
:root {
  --blue: #4C97FF;
  --orange: #FFAB19;
}

/* ================= Body ================= */
body {
  margin: 0;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  color: #ffffff;
  position: relative;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: auto;
  overflow-x: hidden;
  background: #050510;
}

/* 互动Canvas背景 */
#interactive-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  display: block;
}

/* 深色遮罩层 - 增强对比度 */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  pointer-events: none;
  z-index: 0;
}

header, .container, .download-float, .glass-toggle {
  position: relative;
  z-index: 2;
}

body.glass-off {
  color: #333;
}

body.glass-off::before {
  background: rgba(255, 255, 255, 0.15);
}

/* ================= 毛玻璃风格 - 高质感 ================= */
.glass {
  background: rgba(30, 35, 65, 0.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: inherit;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

body.glass-off .glass {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: none;
  border: 1px solid rgba(0, 0, 0, 0.1);
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  color: #333;
}

/* ===== 卡片样式 - 高质感毛玻璃 ===== */
.project-card.glass {
  background: rgba(25, 30, 55, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.35);
  overflow: visible;
  position: relative;
}

body.glass-off .project-card.glass {
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: none;
  border: 1px solid rgba(0, 0, 0, 0.1);
}

.project-card {
  position: relative;
  isolation: isolate;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  cursor: grab;
  transition: box-shadow 0.3s ease;
  padding: 1.5rem;
  text-align: center;
  border-radius: 20px;
  transform-style: preserve-3d;
  will-change: transform;
  transform: rotateX(0deg) rotateY(0deg) translateZ(0);
  color: white;
}

.project-card:active {
  cursor: grabbing;
}

/* 折射扭曲光晕 - 更亮 */
.project-card .refract-glow {
  position: absolute;
  inset: 0;
  border-radius: 20px;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.2s ease;
  background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
              rgba(180, 220, 255, 0.4) 0%, 
              rgba(120, 170, 255, 0.15) 25%,
              transparent 70%);
  mix-blend-mode: screen;
  filter: blur(12px);
}

.project-card .refract-ring {
  position: absolute;
  inset: 0;
  border-radius: 20px;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.25s ease;
  background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
              transparent 60%,
              rgba(120, 170, 255, 0.12) 80%,
              rgba(180, 220, 255, 0.22) 95%);
  filter: blur(8px);
}

.project-card.refract-active .refract-glow {
  opacity: 1;
}

.project-card.refract-active .refract-ring {
  opacity: 0.8;
}

.project-card .glow-effect {
  position: absolute;
  inset: 0;
  border-radius: 20px;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.2s ease;
  background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
              rgba(220, 240, 255, 0.25) 0%, 
              rgba(170, 200, 255, 0.08) 40%,
              transparent 70%);
  mix-blend-mode: overlay;
  filter: blur(10px);
}

.project-card.glow-active .glow-effect {
  opacity: 0.7;
}

.project-card > *:not(.refract-glow):not(.refract-ring):not(.glow-effect) {
  position: relative;
  z-index: 2;
}

.project-image {
  height: 150px;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 1rem;
  transform: translateZ(10px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  transition: transform 0.2s;
}

.project-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s;
  pointer-events: none;
}

.project-card:hover .project-image img {
  transform: scale(1.02);
}

.project-card h3, .project-card p, .project-card .btn {
  transform: translateZ(6px);
  pointer-events: auto;
  color: white;
}

body.glass-off .project-card h3,
body.glass-off .project-card p {
  color: #333;
}

.btn {
  display: inline-block;
  padding: 0.8rem 1.5rem;
  border-radius: 50px;
  font-weight: bold;
  text-decoration: none;
  background: var(--blue);
  color: white;
  transition: all 0.2s;
  margin-top: 0.5rem;
  border: none;
  cursor: pointer;
  font-size: 0.9rem;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

.btn:hover {
  transform: scale(1.02) translateZ(8px);
  background: #3a7be0;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.project-card:hover {
  box-shadow: 0 25px 40px -12px rgba(0,0,0,0.6);
}

/* ===== 开关按钮和下载按钮 ===== */
.glass-toggle, .download-trigger {
  transition: transform 0.05s linear;
  transform-origin: center;
  will-change: transform;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
}

.glass-toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 9999;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(30, 35, 65, 0.6);
  backdrop-filter: blur(14px);
  cursor: grab;
  -webkit-tap-highlight-color: transparent;
  outline: none;
  border: 1px solid rgba(255,255,255,0.35);
}

.glass-toggle:active {
  cursor: grabbing;
}

.glass-toggle svg {
  width: 22px;
  height: 22px;
  fill: white;
}

body.glass-off .glass-toggle svg {
  fill: #333;
}

.download-float {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 9999;
}

.download-trigger {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: grab;
  transition: 0.2s;
  -webkit-tap-highlight-color: transparent;
  outline: none;
  background: rgba(30, 35, 65, 0.6);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.35);
}

.download-trigger:active {
  cursor: grabbing;
}

.download-trigger svg {
  width: 24px;
  height: 24px;
  fill: white;
}

.download-panel {
  position: absolute;
  right: 0;
  bottom: 70px;
  width: 260px;
  padding: 16px;
  display: none;
  backdrop-filter: blur(20px);
  background: rgba(25, 30, 55, 0.85);
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.25);
}

.download-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 14px;
  margin-bottom: 8px;
  color: white;
}

.download-item a {
  padding: 4px 10px;
  background: var(--blue);
  color: white;
  border-radius: 20px;
  text-decoration: none;
  font-size: 12px;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

.download-mask {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 9998;
  display: none;
}

header {
  text-align: center;
  padding: 3rem 1rem;
  background: linear-gradient(135deg, rgba(50, 80, 180, 0.5), rgba(80, 60, 140, 0.5));
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.25);
}

header h1, header p {
  color: white;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.container {
  max-width: 1200px;
  margin: 2rem auto;
  padding: 0 1rem;
}

.section-title {
  font-size: 1.8rem;
  border-left: 5px solid var(--orange);
  padding-left: 10px;
  margin-bottom: 0.4rem;
  color: white;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}

.section-desc {
  color: rgba(255,255,255,0.85);
}

.project-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 2rem;
  perspective: 1200px;
}

/* ===== 管理员入口按钮 ===== */
#admin-entry {
  position: fixed;
  bottom: 90px;
  right: 24px;
  z-index: 9999;
}

#admin-entry .btn {
  background: #FF6B6B;
  box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
}

#admin-entry .btn:hover {
  background: #e55a5a;
}

/* ===== 管理员面板弹窗 ===== */
#adminPanel {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  z-index: 99999;
  backdrop-filter: blur(10px);
  justify-content: center;
  align-items: center;
  padding: 20px;
}

#adminPanel .panel-content {
  background: #1a1a2e;
  border-radius: 20px;
  padding: 30px;
  max-width: 500px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  color: white;
  border: 1px solid rgba(255,255,255,0.1);
}

#adminPanel .panel-content h2 {
  margin-top: 0;
}

#adminPanel .panel-content h3 {
  margin: 15px 0 10px 0;
  color: #FFAB19;
}

#adminPanel input,
#adminPanel select {
  width: 100%;
  padding: 10px 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #2a2a4e;
  color: white;
  font-size: 14px;
  box-sizing: border-box;
}

#adminPanel input::placeholder {
  color: #888;
}

#adminPanel select option {
  background: #2a2a4e;
}

#adminPanel .admin-project-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  background: #2a2a4e;
  border-radius: 10px;
  margin-bottom: 8px;
}

#adminPanel .admin-project-item span {
  flex: 1;
  margin-right: 10px;
  word-break: break-word;
}

#adminPanel .admin-project-item .del-btn {
  background: #FF6B6B;
  color: white;
  border: none;
  padding: 5px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
  flex-shrink: 0;
}

#adminPanel .admin-project-item .del-btn:hover {
  background: #e55a5a;
}

#adminPanel .close-btn {
  margin-top: 15px;
  background: transparent;
  border: 1px solid #666;
  padding: 8px 20px;
  border-radius: 10px;
  color: white;
  cursor: pointer;
  width: 100%;
}

#adminPanel .close-btn:hover {
  background: rgba(255,255,255,0.05);
}

#adminPanel .logout-btn {
  float: right;
  background: transparent;
  border: none;
  color: #FF6B6B;
  cursor: pointer;
  font-size: 14px;
}

#adminPanel .logout-btn:hover {
  text-decoration: underline;
}

#adminPanel hr {
  border-color: #333;
  margin: 20px 0;
}

/* ===== 加载状态 ===== */
.loading-placeholder {
  text-align: center;
  padding: 40px;
  color: rgba(255,255,255,0.5);
  font-size: 18px;
}

/* ===== 涟漪效果 ===== */
.ripple {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 10000;
  transform: translate(-50%, -50%);
  animation: rippleAnim 1s ease-out forwards;
}

body.glass-on .ripple {
  border: 2px solid rgba(100, 150, 255, 0.7);
}

body.glass-off .ripple {
  border: 2px solid rgba(0,0,0,0.3);
}

@keyframes rippleAnim {
  from { width: 32px; height: 32px; opacity: 1; }
  to { width: 140px; height: 140px; opacity: 0; }
}

@media (max-width: 768px) {
  .project-list { gap: 1.25rem; }
  #adminPanel .panel-content { padding: 20px; }
}
</style>
</head>

<body class="glass-on">

<canvas id="interactive-bg"></canvas>

<!-- ===== 毛玻璃切换按钮 ===== -->
<div class="glass-toggle" id="glassToggle">
  <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h11v2zm0-4H6V7h11v2z"/></svg>
</div>

<!-- ===== 页眉 ===== -->
<header class="glass">
  <h1>我的作品集</h1>
  <p>✨ 3D倾斜 · 八方向拉伸 · 高对比毛玻璃 · 网格粒子背景 ✨</p>
</header>

<!-- ===== 作品列表容器 ===== -->
<div class="container" id="scratchContainer">

<div id="adminPanel">
  <div class="panel-content">

    <!-- 登录表单 -->
    <div id="loginForm">
      <input id="loginUser" placeholder="用户名" autocomplete="username">

<script>
// ============================================================
// 1. API 基础配置
// ============================================================
const API_BASE = window.location.origin; // 使用当前域名，开发时可改为具体Worker地址

// ============================================================
// 2. 加载并渲染作品列表（公开）
// ============================================================
async function loadProjects() {
  try {
    const res = await fetch(`${API_BASE}/api/projects`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const projects = await res.json();
    renderProjects(projects);
  } catch (e) {
    console.error('加载作品失败:', e);
    document.querySelectorAll('.project-list').forEach(el => {
      el.innerHTML = `<div style="color:#FF6B6B; text-align:center; padding:40px;">⚠️ 加载失败，请刷新重试</div>`;
    });
  }
}

function renderProjects(projects) {
  // 按分类分组
  const scratch = projects.filter(p => p.category === 'Scratch 作品');
  const html = projects.filter(p => p.category === 'HTML 小游戏');
  
  renderProjectList('scratchList', scratch);
  renderProjectList('htmlList', html);
}

function renderProjectList(containerId, projects) {
  const container = document.getElementById(containerId);
  if (!container) return;
  
  if (!projects || projects.length === 0) {
    container.innerHTML = `<div style="color:rgba(255,255,255,0.5); text-align:center; padding:30px;">暂无作品</div>`;
    return;
  }
  
  container.innerHTML = projects.map(p => `
    <div class="project-card glass" data-tilt>
      <div class="project-image">
        <img src="${p.image || 'https://placehold.co/400x200?text=No+Image'}" alt="${p.title}" loading="lazy" onerror="this.src='https://placehold.co/400x200?text=加载失败'">
      </div>
      <h3>${escapeHtml(p.title)}</h3>
      <p>${escapeHtml(p.description || '')}</p>
      <a href="${escapeHtml(p.link)}" class="btn" target="_blank">开始体验</a>
    </div>
  `).join('');
  
  // 重新绑定卡片交互（因为DOM被替换了）
  setTimeout(() => bindCardEffects(), 50);
}

// 简单的防XSS转义
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
// 3. 管理员登录
// ============================================================
async function adminLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  
  if (!username || !password) {
    alert('请输入用户名和密码');
    return;
  }
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('adminToken', data.token);
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      loadAdminProjects();
      document.getElementById('admin-entry').style.display = 'block';
    } else {
      const err = await res.json();
      alert('登录失败: ' + (err.error || '用户名或密码错误'));
    }
  } catch (e) {
    alert('网络错误，请检查后端服务是否可用');
  }
}

function logout() {
  localStorage.removeItem('adminToken');
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('adminContent').style.display = 'none';
  document.getElementById('admin-entry').style.display = 'none';
  closeAdminPanel();
}

// ============================================================
// 4. 管理员：加载作品列表
// ============================================================
async function loadAdminProjects() {
  const token = localStorage.getItem('adminToken');
  if (!token) return;
  
  try {
    const res = await fetch(`${API_BASE}/api/projects`);
    if (!res.ok) throw new Error();
    const projects = await res.json();
    
    const container = document.getElementById('projectListAdmin');
    if (projects.length === 0) {
      container.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">暂无作品</div>';
      return;
    }
    
    container.innerHTML = projects.map(p => `
      <div class="admin-project-item">
        <span>${escapeHtml(p.title)}</span>
        <button class="del-btn" onclick="deleteProject(${p.id})">删除</button>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('projectListAdmin').innerHTML = '<div style="color:#FF6B6B; text-align:center; padding:20px;">加载失败</div>';
  }
}

// ============================================================
// 5. 管理员：添加作品
// ============================================================
async function addProject() {
  const token = localStorage.getItem('adminToken');
  if (!token) {
    alert('请先登录');
    return;
  }
  
  const title = document.getElementById('newTitle').value.trim();
  const link = document.getElementById('newLink').value.trim();
  if (!title || !link) {
    alert('标题和链接为必填项');
    return;
  }
  
  const data = {
    title,
    description: document.getElementById('newDesc').value.trim(),
    image: document.getElementById('newImage').value.trim() || 'https://placehold.co/400x200?text=作品封面',
    link,
    category: document.getElementById('newCategory').value
  };
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/projects`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify(data)
    });
    
    if (res.ok) {
      alert('✅ 添加成功！');
      // 清空表单
      document.getElementById('newTitle').value = '';
      document.getElementById('newDesc').value = '';
      document.getElementById('newImage').value = '';
      document.getElementById('newLink').value = '';
      // 刷新列表
      loadAdminProjects();
      loadProjects();
    } else {
      const err = await res.json();
      alert('添加失败: ' + (err.error || '未知错误'));
    }
  } catch (e) {
    alert('网络错误，请检查后端服务');
  }
}

async function deleteProject(id) {
  if (!confirm('确定要删除这个作品吗？')) return;
  
  const token = localStorage.getItem('adminToken');
  try {
    const res = await fetch(`${API_BASE}/api/admin/projects/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    
    if (res.ok) {
      alert('已删除');
      loadAdminProjects();
      loadProjects();
    } else {
      alert('删除失败');
    }
  } catch (e) {
    alert('网络错误');
  }
}

function openAdminPanel() {
  const panel = document.getElementById('adminPanel');
  panel.style.display = 'flex';

  if (token) {
    document.getElementById('loginForm').style.display = 'none';

    loadAdminProjects();
  } else {

// --- 9.1 Canvas 粒子背景 ---
(function() {
    const canvas = document.getElementById('interactive-bg');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth, height = window.innerHeight;
    let mouseX = width / 2, mouseY = height / 2;
    let particles = [];
    const PARTICLE_COUNT = 80;
    
    function resizeCanvas() {
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width; canvas.height = height;
        initParticles();
    }
    function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * width, y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
                size: Math.random() * 2.5 + 1.2, alpha: Math.random() * 0.6 + 0.4,
                hue: 200 + Math.random() * 100
            });
        }
    }
    function updateParticles() {
        for (let p of particles) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) { p.x = 0; p.vx *= -0.5; }
            if (p.x > width) { p.x = width; p.vx *= -0.5; }
            if (p.y < 0) { p.y = 0; p.vy *= -0.5; }
            if (p.y > height) { p.y = height; p.vy *= -0.5; }
            let maxSpeed = 1.3;
            if (Math.abs(p.vx) > maxSpeed) p.vx = p.vx > 0 ? maxSpeed : -maxSpeed;
            if (Math.abs(p.vy) > maxSpeed) p.vy = p.vy > 0 ? maxSpeed : -maxSpeed;
        }
    }
    function getClosestParticlesToMouse(particles, mouseX, mouseY, count = 2) {
        if (!particles.length) return [];
        const distances = particles.map((p, idx) => ({ idx, dist: Math.hypot(p.x - mouseX, p.y - mouseY) }));
        distances.sort((a, b) => a.dist - b.dist);
        return distances.slice(0, count).map(d => particles[d.idx]);
    }
    function draw() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        let gradient = ctx.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, '#050510');
        gradient.addColorStop(0.5, '#0a0a25');
        gradient.addColorStop(1, '#030310');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const p1 = particles[i], p2 = particles[j];
                const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                const maxDist = 150;
                if (dist < maxDist) {
                    const alpha = (1 - dist / maxDist) * 0.45;
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `hsla(210, 80%, 65%, ${alpha})`;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
            }
        }
        const closestParticles = getClosestParticlesToMouse(particles, mouseX, mouseY, 2);
        for (let p of closestParticles) {
            const distToMouse = Math.hypot(p.x - mouseX, p.y - mouseY);
            if (distToMouse < 200) {
                const alpha = (1 - distToMouse / 200) * 0.7;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(mouseX, mouseY);
                ctx.strokeStyle = `hsla(45, 90%, 65%, ${alpha})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }
        let mouseGlow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 80);
        mouseGlow.addColorStop(0, `hsla(45, 85%, 65%, 0.12)`);
        mouseGlow.addColorStop(0.5, `hsla(45, 80%, 60%, 0.06)`);
        mouseGlow.addColorStop(1, 'transparent');
        ctx.fillStyle = mouseGlow;
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 80, 0, Math.PI * 2);
        ctx.fill();
        for (let p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${p.hue}, 85%, 70%, ${p.alpha})`;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${p.hue}, 90%, 80%, 0.5)`;
            ctx.fill();
        }
        for (let i = 0; i < 80; i++) {
            let starX = (mouseX * 0.1 + i * 137) % width;
            let starY = (mouseY * 0.08 + i * 293) % height;
            ctx.fillStyle = `rgba(255, 240, 180, ${0.15 + Math.sin(Date.now() * 0.002 + i) * 0.08})`;
            ctx.beginPath();
            ctx.arc(starX, starY, 0.8, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    function animate() {
        updateParticles();
        draw();
        requestAnimationFrame(animate);
    }
    function handleMouseMove(e) { mouseX = e.clientX; mouseY = e.clientY; }
    function handleTouchMove(e) { if (e.touches.length) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; } }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('touchmove', handleTouchMove);
    resizeCanvas();
    animate();
})();
