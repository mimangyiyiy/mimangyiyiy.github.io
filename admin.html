<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a1a;
  color: #fff;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}
.container { max-width: 1000px; margin: 0 auto; }
h1, h2, h3 { margin-top: 0; }
.card {
  background: #1a1a2e;
  padding: 24px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  animation: cardFadeIn 0.4s ease both;
}
.card:hover {
  border-color: rgba(255,255,255,0.12);
  box-shadow: 0 4px 24px rgba(0,0,0,0.2);
}
input, select, textarea {
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 10px;
  border: 1px solid #333;
  border-radius: 8px;
  background: #2a2a4e;
  color: #fff;
  font-size: 14px;
  box-sizing: border-box;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
input:focus, select:focus, textarea:focus {
  border-color: #4C97FF;
  outline: none;
  background: #33335a;
  box-shadow: 0 0 0 3px rgba(76,151,255,0.15);
  transform: scale(1.002);
}
input::placeholder { color: #888; }
select option { background: #2a2a4e; }
.btn {
  padding: 10px 22px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  position: relative;
  overflow: hidden;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: #4C97FF; color: #fff; }
.btn-primary:hover { background: #3a7be0; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(76,151,255,0.3); }
.btn-success { background: #4CAF50; color: #fff; }
.btn-success:hover { background: #3d8b40; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(76,175,80,0.3); }
.btn-warning { background: #FFAB19; color: #222; }
.btn-warning:hover { background: #e89a0f; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,171,25,0.3); }
.btn-danger { background: #FF6B6B; color: #fff; }
.btn-danger:hover { background: #e55a5a; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,107,0.3); }
.btn-secondary { background: #555; color: #fff; }
.btn-secondary:hover { background: #444; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(85,85,85,0.3); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
  animation: slideDown 0.4s ease both;
}
.project-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #2a2a4e;
  margin-bottom: 8px;
  gap: 10px;
  border-radius: 8px;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  animation: listItemIn 0.3s ease both;
}
.project-item:hover {
  background: #33335a;
  transform: translateX(4px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.project-item .info {
  flex: 1;
  min-width: 0;
}
.project-item .info .title {
  font-weight: bold;
  display: block;
}
.project-item .info .sub {
  font-size: 12px;
  opacity: 0.6;
  display: block;
}
.project-item .actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.empty-msg {
  color: #888;
  text-align: center;
  padding: 30px;
}
#loginArea { display: block; }
#adminArea { display: none; }
.status-msg {
  padding: 10px 16px;
  margin-bottom: 10px;
  border-radius: 8px;
  display: none;
  animation: slideDown 0.3s ease both;
}
.status-msg.success { background: rgba(76,175,80,0.2); color: #81C784; display: block; }
.status-msg.error { background: rgba(255,107,107,0.2); color: #FF6B6B; display: block; }
.upload-area {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.upload-area input[type="file"] {
  flex: 1;
  min-width: 150px;
  padding: 8px;
  border-radius: 8px;
  background: #2a2a4e;
  border: 1px solid #333;
  color: #fff;
  margin-bottom: 0;
  transition: all 0.3s ease;
}
.upload-area input[type="file"]:hover { border-color: #555; }
.upload-area .btn { flex-shrink: 0; }
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  border-radius: 10px;
  background: #12121f;
  padding: 4px;
}
.tab-btn {
  flex: 1;
  padding: 12px 16px;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: #888;
  cursor: pointer;
  font-weight: bold;
  font-size: 13px;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  min-width: 70px;
}
.tab-btn.active {
  background: #4C97FF;
  color: #fff;
  box-shadow: 0 4px 16px rgba(76,151,255,0.25);
  transform: scale(1.02);
}
.tab-btn:hover:not(.active) {
  background: #2a2a4e;
  color: #fff;
  transform: translateY(-1px);
}
.tab-content { display: none; animation: fadeIn 0.3s ease both; }
.tab-content.active { display: block; }
#editModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 99999;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(8px);
  animation: fadeIn 0.25s ease;
}
#editModal .modal-content {
  background: #1a1a2e;
  padding: 30px;
  max-width: 500px;
  width: 95%;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 16px;
  border: 1px solid #333;
  animation: modalPop 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}
#editModal .modal-content h3 { margin-top: 0; }
#editModal .modal-content input,
#editModal .modal-content select,
#editModal .modal-content textarea {
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #2a2a4e;
  color: #fff;
  font-size: 14px;
  box-sizing: border-box;
  transition: all 0.3s ease;
}
#editModal .modal-content textarea { resize: vertical; min-height: 60px; }
#editModal .modal-content .btn-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
#editModal .modal-content .btn-row .btn { flex: 1; }
.file-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: #2a2a4e;
  margin-bottom: 6px;
  gap: 10px;
  border-radius: 8px;
  transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
  animation: listItemIn 0.3s ease both;
}
.file-item:hover {
  background: #33335a;
  transform: translateX(4px) scale(1.003);
  box-shadow: 0 2px 16px rgba(0,0,0,0.15);
}
.file-item .info { flex: 1; min-width: 0; }
.file-item .info .name { font-size: 14px; word-break: break-all; }
.file-item .info .sub { font-size: 12px; opacity: 0.6; }
.file-item .actions { display: flex; gap: 6px; flex-shrink: 0; }
.hint { font-size: 12px; color: #888; margin-top: 4px; }
#imagePreview {
  display: none;
  margin-top: 8px;
  animation: fadeIn 0.3s ease both;
}
#imagePreview img { max-height: 120px; border-radius: 8px; border: 1px solid #333; }
#htmlUploadProgress, #uploadProgress {
  display: none;
  margin-top: 6px;
  font-size: 13px;
  color: #4C97FF;
  animation: fadeIn 0.3s ease both;
}
.kv-content {
  background: #0d0d20;
  padding: 16px;
  border-radius: 10px;
  font-family: monospace;
  font-size: 13px;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 400px;
  overflow: auto;
  border: 1px solid #333;
  margin-top: 10px;
}
.progress-bar-wrap {
  background: #2a2a4e;
  overflow: hidden;
  height: 8px;
  margin: 8px 0 4px;
  border-radius: 4px;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #4C97FF, #6C5CE7, #a855f7);
  width: 0%;
  border-radius: 4px;
  transition: width 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
}
.kv-stats {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #888;
  margin-bottom: 4px;
}
.file-load-progress {
  display: none;
  margin-top: 8px;
  padding: 8px 12px;
  background: #2a2a4e;
  border-radius: 8px;
  font-size: 13px;
  color: #4C97FF;
  animation: fadeIn 0.3s ease both;
}
.file-load-progress .bar-wrap {
  background: #1a1a2e;
  overflow: hidden;
  height: 4px;
  margin-top: 6px;
  border-radius: 2px;
}
.file-load-progress .bar-wrap .bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #4C97FF, #a855f7);
  width: 0%;
  border-radius: 2px;
  transition: width 0.3s ease;
}
#kvModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 99998;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(8px);
  animation: fadeIn 0.25s ease;
}
#kvModal .kv-modal-content {
  background: #1a1a2e;
  padding: 30px;
  max-width: 700px;
  width: 95%;
  max-height: 90vh;
  border-radius: 16px;
  border: 1px solid #333;
  overflow-y: auto;
  animation: modalPop 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}
#kvModal .kv-modal-content h3 { margin-top: 0; }
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes modalPop {
  0% { opacity: 0; transform: scale(0.9) translateY(20px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes listItemIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 8px;
  background: radial-gradient(circle at center, rgba(255,255,255,0.2), transparent 70%);
  opacity: 0;
  transition: opacity 0.4s ease;
}
.btn:hover::after { opacity: 1; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #1a1a2e; border-radius: 3px; }
::-webkit-scrollbar-thumb { background: #4C97FF; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a7be0; }
</style>
</head>
<body>
<div class="container">
  <h1>管理后台</h1>
  <div id="statusMsg" class="status-msg"></div>
  <div id="loginArea" class="card">
    <h2>管理员登录</h2>
    <input id="loginUser" placeholder="用户名" autocomplete="username">
    <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn btn-primary" onclick="adminLogin()" style="width:100%;">登录</button>
  </div>
  <div id="adminArea">
    <div class="header-bar">
      <h2 style="margin:0;">管理</h2>
      <button class="btn btn-danger" onclick="logout()">退出</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-projects" onclick="switchTab('tab-projects')">作品</button>
      <button class="tab-btn" data-tab="tab-downloads" onclick="switchTab('tab-downloads')">下载</button>
      <button class="tab-btn" data-tab="tab-files" onclick="switchTab('tab-files')">文件</button>
      <button class="tab-btn" data-tab="tab-categories" onclick="switchTab('tab-categories')">分类</button>
    </div>
    <div id="tab-projects" class="tab-content active">
      <div class="card">
        <h3>添加作品</h3>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:4px; font-size:14px; color:#aaa;">作品文件 (.html)</label>
          <div class="upload-area">
            <input type="file" id="newHtmlFile" accept=".html">
            <button class="btn btn-primary" onclick="uploadHtmlFile()">上传作品</button>
          </div>
          <div id="htmlUploadProgress">上传中...</div>
          <input id="newLink" placeholder="或手动输入作品链接 *" style="margin-top:8px;">
          <div class="hint">上传 .html 文件后会自动填入链接</div>
        </div>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:4px; font-size:14px; color:#aaa;">作品封面图片</label>
          <div class="upload-area">
            <input type="file" id="newImageFile" accept="image/*">
            <button class="btn btn-primary" onclick="uploadImageToKV()">上传图片到KV</button>
          </div>
          <div id="uploadProgress">上传中...</div>
          <div id="imagePreview"><img id="previewImg" src="" alt="预览"></div>
          <input id="newImage" placeholder="或手动输入图片URL" style="margin-top:8px;">
          <div class="hint">支持 JPG / PNG / WebP / GIF</div>
        </div>
        <input id="newTitle" placeholder="标题 *">
        <input id="newDesc" placeholder="描述">
        <select id="newCategory"></select>
        <button class="btn btn-success" onclick="addProject()" style="width:100%;">添加作品</button>
      </div>
      <div class="card">
        <h3>所有作品</h3>
        <div id="projectListAdmin"><div class="empty-msg">加载中...</div></div>
      </div>
    </div>
    <div id="tab-downloads" class="tab-content">
      <div class="card">
        <h3>添加下载项</h3>
        <input id="newDownloadTitle" placeholder="标题 *">
        <input id="newDownloadDesc" placeholder="描述（可选）">
        <input id="newDownloadLink" placeholder="链接 *">
        <input id="newDownloadLinkText" placeholder="按钮文字（默认：下载）" value="下载">
        <button class="btn btn-success" onclick="addDownload()" style="width:100%;">添加下载项</button>
      </div>
      <div class="card">
        <h3>所有下载项</h3>
        <div id="downloadListAdmin"><div class="empty-msg">加载中...</div></div>
      </div>
    </div>
    <div id="tab-files" class="tab-content">
      <div class="card">
        <h3>KV 文件管理</h3>
        <div style="margin-bottom:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="loadFiles()">刷新</button>
          <span id="fileCount" style="font-size:13px; color:#888;"></span>
        </div>
        <div class="kv-stats">
          <span id="kvUsed">已用: 0 KB</span>
          <span id="kvTotal">总量: 1024000 KB</span>
          <span id="kvPercent">0%</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="kvProgress"></div>
        </div>
        <div class="file-load-progress" id="fileLoadProgress">
          <span id="fileLoadText">加载文件中...</span>
          <div class="bar-wrap">
            <div class="bar-fill" id="fileLoadBar"></div>
          </div>
        </div>
        <div id="fileList" style="margin-top:12px;"><div class="empty-msg">点击刷新加载...</div></div>
      </div>
    </div>
    <div id="tab-categories" class="tab-content">
      <div class="card">
        <h3>管理分类</h3>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
          <input id="newCategoryName" placeholder="新分类名称" style="flex:1; margin-bottom:0;">
          <button class="btn btn-success" onclick="addCategory()" style="flex-shrink:0;">添加</button>
        </div>
        <div id="categoryList"><div class="empty-msg">加载中...</div></div>
      </div>
    </div>
  </div>
</div>
<div id="editModal">
  <div class="modal-content">
    <h3 id="editModalTitle">编辑</h3>
    <input id="editId" type="hidden">
    <div id="editFields"></div>
    <div class="btn-row">
      <button class="btn btn-success" onclick="saveEdit()">保存修改</button>
      <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
    </div>
  </div>
</div>
<div id="kvModal">
  <div class="kv-modal-content">
    <h3 id="kvModalTitle">文件内容</h3>
    <div id="kvModalBody" class="kv-content">加载中...</div>
    <div style="margin-top:15px; text-align:right;">
      <button class="btn btn-secondary" onclick="document.getElementById('kvModal').style.display='none'">关闭</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 1. 配置
// ============================================================
const API_BASE = '';
const KV_LIMIT_KB = 1024 * 1024;
let editType = '';
let editId = null;

// ✅ 文件缓存：已加载的文件内容存这里，避免重复加载
const fileCache = new Map();

// ============================================================
// 2. 工具函数
// ============================================================
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function showStatus(msg, type = 'success') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
  setTimeout(() => { el.className = 'status-msg'; }, 4000);
}
function getToken() {
  return localStorage.getItem('adminToken');
}
function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
  if (tabId === 'tab-files') loadFiles();
  if (tabId === 'tab-downloads') loadAdminDownloads();
}
function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// ============================================================
// 3. 登录 / 退出
// ============================================================
async function adminLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  if (!username || !password) {
    showStatus('请输入用户名和密码', 'error');
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok && data.token) {
      localStorage.setItem('adminToken', data.token);
      document.getElementById('loginArea').style.display = 'none';
      document.getElementById('adminArea').style.display = 'block';
      await Promise.all([
        loadCategoriesWithDelete(),
        loadAdminProjects(),
        loadAdminDownloads()
      ]);
      showStatus('登录成功');
    } else {
      showStatus('登录失败：' + (data.error || '用户名或密码错误'), 'error');
    }
  } catch (e) {
    showStatus('网络错误', 'error');
  }
}
function logout() {
  localStorage.removeItem('adminToken');
  document.getElementById('loginArea').style.display = 'block';
  document.getElementById('adminArea').style.display = 'none';
  showStatus('已退出');
}

// ============================================================
// 4. 分类管理
// ============================================================
async function loadCategoriesWithDelete() {
  try {
    const res = await fetch(`${API_BASE}/api/categories`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const categories = await res.json();
    const select = document.getElementById('newCategory');
    select.innerHTML = categories.map(c =>
      `<option value="${c.id}">${escapeHtml(c.name)}</option>`
    ).join('');
    const container = document.getElementById('categoryList');
    if (categories.length === 0) {
      container.innerHTML = '<div class="empty-msg">暂无分类，请添加</div>';
      return;
    }
    container.innerHTML = categories.map(c => `
      <div class="project-item">
        <span>${escapeHtml(c.name)}</span>
        <button class="btn btn-danger btn-sm" onclick="deleteCategoryWithCheck(${c.id})">删除</button>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('categoryList').innerHTML = `<div class="empty-msg">加载失败</div>`;
  }
}
async function addCategory() {
  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }
  const name = document.getElementById('newCategoryName').value.trim();
  if (!name) { showStatus('请输入分类名称', 'error'); return; }
  try {
    const res = await fetch(`${API_BASE}/api/admin/categories`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ name })
    });
    if (res.ok) {
      showStatus('分类添加成功');
      document.getElementById('newCategoryName').value = '';
      await loadCategoriesWithDelete();
    } else {
      const err = await res.json();
      showStatus('添加失败：' + (err.error || '未知错误'), 'error');
    }
  } catch (e) {
    showStatus('网络错误', 'error');
  }
}

// ============================================================
// 7. ✅ 文件管理（进度条显示 [当前进度]/[文件大小] + 缓存）
// ============================================================
async function loadFiles() {
  const container = document.getElementById('fileList');
  const countEl = document.getElementById('fileCount');
  const progressEl = document.getElementById('fileLoadProgress');
  const progressBar = document.getElementById('fileLoadBar');
  const progressText = document.getElementById('fileLoadText');
  
  container.innerHTML = '<div class="empty-msg">加载中...</div>';
  progressEl.style.display = 'block';
  progressText.textContent = '正在获取文件大小...';
  progressBar.style.width = '5%';
  
  try {
    // ✅ 先用 HEAD 获取大小
    const headRes = await fetch(`${API_BASE}/api/kv-list`, { method: 'HEAD' });
    let totalSize = parseInt(headRes.headers.get('Content-Length') || '0');
    let totalSizeKB = totalSize / 1024;
    let totalSizeKnown = totalSize > 0;
    
    // 如果 HEAD 获取不到，用 GET 请求
    if (!totalSizeKnown) {
      const getRes = await fetch(`${API_BASE}/api/kv-list`);
      totalSize = parseInt(getRes.headers.get('Content-Length') || '0');
      totalSizeKB = totalSize / 1024;
      totalSizeKnown = totalSize > 0;
    }
    
    progressText.textContent = totalSizeKnown ? 
      `0.0 KB / ${totalSizeKB.toFixed(1)} KB` : 
      '正在加载...';
    progressBar.style.width = '10%';
    
    const res = await fetch(`${API_BASE}/api/kv-list`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    
    const reader = res.body.getReader();
    let receivedLength = 0;
    const chunks = [];
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      chunks.push(value);
      receivedLength += value.length;
      
      if (totalSizeKnown) {
        const percent = (receivedLength / totalSize) * 100;
        progressBar.style.width = Math.min(percent, 99) + '%';
        const displayKB = (receivedLength / 1024).toFixed(1);
        progressText.textContent = `${displayKB} KB / ${totalSizeKB.toFixed(1)} KB`;
      }
    }
    
    const allChunks = new Uint8Array(receivedLength);
    let position = 0;
    for (const chunk of chunks) {
      allChunks.set(chunk, position);
      position += chunk.length;
    }
    
    const decoder = new TextDecoder('utf-8');
    const text = decoder.decode(allChunks);
    const data = JSON.parse(text);
    
    const finalKB = receivedLength / 1024;
    const totalKB = totalSizeKnown ? totalSizeKB.toFixed(1) : finalKB.toFixed(1);
    progressBar.style.width = '100%';
    progressText.textContent = `完成 · ${finalKB.toFixed(1)} KB / ${totalKB} KB`;
    setTimeout(() => {
      progressEl.style.display = 'none';
      progressBar.style.width = '0%';
    }, 500);
    
    // ... 后续渲染代码保持不变
    countEl.textContent = '共 ' + data.total + ' 个文件';
    
    let totalSizeKB_sum = 0;
    data.keys.forEach(item => { totalSizeKB_sum += (item.size || 0) / 1024; });
    const percent = Math.min((totalSizeKB_sum / KV_LIMIT_KB) * 100, 100);
    
    document.getElementById('kvUsed').textContent = '已用: ' + totalSizeKB_sum.toFixed(1) + ' KB';
    document.getElementById('kvPercent').textContent = percent.toFixed(1) + '%';
    document.getElementById('kvProgress').style.width = percent + '%';
    
    if (data.keys.length === 0) {
      container.innerHTML = '<div class="empty-msg">KV 中暂无文件</div>';
      return;
    }
    
    container.innerHTML = data.keys.map((item, index) => {
      const ext = item.key.split('.').pop().toLowerCase();
      const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext);
      const icon = isImage ? '🖼️' : '📄';
      const previewUrl = `/api/kv-get/${encodeURIComponent(item.key)}`;
      const sizeKB = ((item.size || 0) / 1024).toFixed(1);
      const delay = index * 40;
      
      return `
      <div class="file-item" style="animation-delay:${delay}ms">
        <div class="info">
          <span class="name">${icon} ${escapeHtml(item.key)}</span>
          <span class="sub">${sizeKB} KB · ${isImage ? '图片' : '文件'}</span>
        </div>
        <div class="actions">
          ${isImage ? `<a href="${previewUrl}" target="_blank" class="btn btn-primary btn-sm">查看</a>` : `<button class="btn btn-primary btn-sm" onclick="viewKVWithProgress('${escapeHtml(item.key)}')">查看</button>`}
          <button class="btn btn-danger btn-sm" onclick="deleteFileKV('${escapeHtml(item.key)}')">删除</button>
        </div>
      </div>
    `}).join('');
    
  } catch (e) {
    container.innerHTML = '<div class="empty-msg">加载失败：' + (e.message || '未知错误') + '</div>';
    progressEl.style.display = 'none';
    progressBar.style.width = '0%';
  }
}

  if (fileCache.has(key)) {
    const data = fileCache.get(key);
    document.getElementById('kvModalTitle').textContent = key + ' (' + data.sizeKB + ')';
    document.getElementById('kvModalBody').textContent = data.value || '(空)';
    document.getElementById('kvModal').style.display = 'flex';
    showStatus('已从缓存加载', 'success');
    return;
  }
  
  const progressEl = document.getElementById('fileLoadProgress');
  const progressBar = document.getElementById('fileLoadBar');
  const progressText = document.getElementById('fileLoadText');
  
  progressEl.style.display = 'block';
  progressText.textContent = '正在获取文件大小...';
  progressBar.style.width = '5%';
  
  try {
    // ✅ 先用 HEAD 请求获取文件大小
    const headRes = await fetch(`${API_BASE}/api/kv-get/${encodeURIComponent(key)}`, {
      method: 'HEAD'
    });
    
    let totalSize = parseInt(headRes.headers.get('Content-Length') || '0');
    let totalSizeKB = totalSize / 1024;
    let totalSizeKnown = totalSize > 0;
    
    // 如果 HEAD 获取不到，尝试用 GET 请求获取
    if (!totalSizeKnown) {
      const getRes = await fetch(`${API_BASE}/api/kv-get/${encodeURIComponent(key)}`);
      totalSize = parseInt(getRes.headers.get('Content-Length') || '0');
      totalSizeKB = totalSize / 1024;
      totalSizeKnown = totalSize > 0;
      // 如果还是获取不到，用最终数据大小
      if (!totalSizeKnown) {
        const data = await getRes.json();
        totalSize = data.value ? data.value.length : 0;
        totalSizeKB = totalSize / 1024;
        totalSizeKnown = true;
        fileCache.set(key, data);
        document.getElementById('kvModalTitle').textContent = key + ' (' + data.sizeKB + ')';
        document.getElementById('kvModalBody').textContent = data.value || '(空)';
        document.getElementById('kvModal').style.display = 'flex';
        progressEl.style.display = 'none';
        progressBar.style.width = '0%';
        return;
      }
    }
    
    progressText.textContent = `0.0 KB / ${totalSizeKB.toFixed(1)} KB`;
    progressBar.style.width = '10%';
    
    // ✅ 开始下载
    const res = await fetch(`${API_BASE}/api/kv-get/${encodeURIComponent(key)}`);
    if (!res.ok) {
      const err = await res.json();
      showStatus('加载失败：' + (err.error || '未知错误'), 'error');
      progressEl.style.display = 'none';
      progressBar.style.width = '0%';
      return;
    }
    
    const reader = res.body.getReader();
    let receivedLength = 0;
    const chunks = [];
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      chunks.push(value);
      receivedLength += value.length;
      
      // ✅ 进度 = 已下载 / 总大小
      const percent = (receivedLength / totalSize) * 100;
      progressBar.style.width = Math.min(percent, 99) + '%';
      
      const displayKB = (receivedLength / 1024).toFixed(1);
      progressText.textContent = `${displayKB} KB / ${totalSizeKB.toFixed(1)} KB`;
    }
    
    const allChunks = new Uint8Array(receivedLength);
    let position = 0;
    for (const chunk of chunks) {
      allChunks.set(chunk, position);
      position += chunk.length;
    }
    
    const decoder = new TextDecoder('utf-8');
    const text = decoder.decode(allChunks);
    const data = JSON.parse(text);
    
    fileCache.set(key, data);
    
    progressBar.style.width = '100%';
    const finalKB = receivedLength / 1024;
    progressText.textContent = `完成 · ${finalKB.toFixed(1)} KB / ${totalSizeKB.toFixed(1)} KB`;
    
    setTimeout(() => {
      document.getElementById('kvModalTitle').textContent = key + ' (' + data.sizeKB + ')';
      document.getElementById('kvModalBody').textContent = data.value || '(空)';
      document.getElementById('kvModal').style.display = 'flex';
      setTimeout(() => {
        progressEl.style.display = 'none';
        progressBar.style.width = '0%';
      }, 300);
    }, 200);
    
  } catch (e) {
    showStatus('加载失败：' + (e.message || '未知错误'), 'error');
    progressEl.style.display = 'none';
    progressBar.style.width = '0%';
  }
}

      link_text: document.getElementById('editDownloadLinkText').value.trim() || '下载'
    };
    try {
      const res = await fetch(`${API_BASE}/api/admin/downloads/${editId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        showStatus('下载项已更新');
        closeEditModal();
        loadAdminDownloads();
      } else {
        const err = await res.json();
        showStatus('更新失败：' + (err.error || '未知错误'), 'error');
      }
    } catch (e) {
      showStatus('网络错误', 'error');
    }
  } else if (editType === 'project') {
    const title = document.getElementById('editProjectTitle').value.trim();
    const link = document.getElementById('editProjectLink').value.trim();
    if (!title || !link) { showStatus('标题和链接为必填项', 'error'); return; }
    const data = {
      title,
      description: document.getElementById('editProjectDesc').value.trim(),
      link,
      image: document.getElementById('editProjectImage').value.trim() || 'https://placehold.co/400x200?text=作品封面',
      category_id: parseInt(document.getElementById('editProjectCategory').value) || null
    };
    try {
      const res = await fetch(`${API_BASE}/api/admin/projects/${editId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        showStatus('作品已更新');
        closeEditModal();
        loadAdminProjects();
      } else {
        const err = await res.json();
        showStatus('更新失败：' + (err.error || '未知错误'), 'error');
      }
    } catch (e) {
      showStatus('网络错误', 'error');
    }
  }
}

function closeEditModal() {
  document.getElementById('editModal').style.display = 'none';
  editId = null;
  editType = '';
}

// ============================================================
// 10. 检查登录状态
// ============================================================
function checkAuth() {
  const token = getToken();
  if (token) {
    document.getElementById('loginArea').style.display = 'none';
    document.getElementById('adminArea').style.display = 'block';
    loadCategoriesWithDelete();
    loadAdminProjects();
    loadAdminDownloads();
  }
}

// ============================================================
// 11. 页面启动
// ============================================================
checkAuth();
console.log('管理后台已加载（[当前进度]/[文件大小] + 缓存）');
</script>
</body>
