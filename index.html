<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>我的作品集</title>

<style>
/* ================= 基础 ================= */
:root { --blue: #4C97FF; --orange: #FFAB19; }

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  color: #fff;
  background-image: url('https://ts1.tc.mm.bing.net/th/id/R-C.b0ea268fa1be279d112489ce83ad4696?rik=qItsh%2fBiy33hlg&riu=http%3a%2f%2fwww.quazero.com%2fuploads%2fallimg%2f140303%2f1-140303215009.jpg&ehk=S6PLWamt%2bMzQV8uO9ugcU5d5M19BpXtCpNz2cRJ7q9M%3d&risl=&pid=ImgRaw&r=0');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  overflow-x: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  pointer-events: none;
  z-index: 0;
}

header, .container, .download-float, .glass-toggle {
  position: relative;
  z-index: 2;
}

/* ===== 关闭毛玻璃 ===== */
body.glass-off {
  color: #000 !important;
  background-image: none !important;
  background-color: #f5f5f7 !important;
}
body.glass-off::before { display: none !important; }
body.glass-off .glass,
body.glass-off .project-card,
body.glass-off .download-panel,
body.glass-off .download-trigger,
body.glass-off .glass-toggle,
body.glass-off header {
  background: #fff !important;
  backdrop-filter: none !important;
  border: 1px solid #e0e0e0 !important;
  color: #000 !important;
  box-shadow: none !important;
}
body.glass-off .project-card h3,
body.glass-off .project-card p,
body.glass-off .project-card .btn { color: #000 !important; }
body.glass-off .project-card .btn { background: #4C97FF !important; color: #fff !important; }
body.glass-off .section-title,
body.glass-off header h1 { color: #000 !important; text-shadow: none !important; }
body.glass-off .download-panel h4,
body.glass-off .download-item { color: #000 !important; }
body.glass-off .download-trigger svg,
body.glass-off .glass-toggle svg { fill: #000 !important; }
body.glass-off .project-card::after { display: none !important; }

/* ===== 毛玻璃 ===== */
.glass {
  background: rgba(30,35,65,0.2);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.04);
  box-shadow: none;
}

/* ===== 卡片：光学边缘反射 ===== */
.project-card {
  position: relative;
  padding: 1.5rem;
  text-align: center;
  border-radius: 24px;
  background: rgba(25,30,55,0.12);
  backdrop-filter: blur(10px) saturate(1.05);
  -webkit-backdrop-filter: blur(10px) saturate(1.05);
  border: 1px solid rgba(255,255,255,0.04);
  color: #fff;
  transform-style: preserve-3d;
  will-change: transform;
  cursor: default;
  overflow: visible !important;
  isolation: isolate;
  box-shadow: none !important;
  transition: none;
}

/* ✅ 边缘反射层 - 静态光学反射和折射 */
.project-card::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 28px;
  pointer-events: none;
  z-index: 0;
  /* 边缘反射光晕 + 折射色散 */
  background: 
    /* 左上角反射光 - 模拟光源 */
    radial-gradient(ellipse at 18% 20%, 
      rgba(255, 255, 255, 0.10) 0%, 
      transparent 55%
    ),
    /* 右下角反射光 - 模拟环境光 */
    radial-gradient(ellipse at 82% 80%, 
      rgba(200, 220, 255, 0.06) 0%, 
      transparent 55%
    ),
    /* 边缘折射色散 - 彩虹色偏移 */
    conic-gradient(
      from 0deg at 50% 50%,
      rgba(120, 180, 255, 0.03) 0deg,
      rgba(180, 120, 255, 0.02) 90deg,
      rgba(255, 200, 100, 0.01) 180deg,
      rgba(120, 180, 255, 0.03) 270deg,
      rgba(120, 180, 255, 0.03) 360deg
    );
  backdrop-filter: blur(0.5px) contrast(1.02) brightness(1.01);
  -webkit-backdrop-filter: blur(0.5px) contrast(1.02) brightness(1.01);
  box-shadow: none !important;
  transition: none;
}

/* 卡片悬停时反射略微增强 */
.project-card:hover::after {
  background: 
    radial-gradient(ellipse at 18% 20%, 
      rgba(255, 255, 255, 0.16) 0%, 
      transparent 55%
    ),
    radial-gradient(ellipse at 82% 80%, 
      rgba(200, 220, 255, 0.10) 0%, 
      transparent 55%
    ),
    conic-gradient(
      from 0deg at 50% 50%,
      rgba(120, 180, 255, 0.05) 0deg,
      rgba(180, 120, 255, 0.03) 90deg,
      rgba(255, 200, 100, 0.02) 180deg,
      rgba(120, 180, 255, 0.05) 270deg,
      rgba(120, 180, 255, 0.05) 360deg
    );
  backdrop-filter: blur(1px) contrast(1.04) brightness(1.02);
  -webkit-backdrop-filter: blur(1px) contrast(1.04) brightness(1.02);
}

/* 卡片内容 */
.project-card > * {
  position: relative;
  z-index: 2;
}

.project-image {
  height: 150px;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 1rem;
  box-shadow: none;
  transform: translateZ(8px);
}
.project-image img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.4s ease;
  pointer-events: none;
}
.project-card:hover .project-image img { transform: scale(1.02); }

.project-card h3 {
  margin: 0.5rem 0 0.2rem;
  font-size: 1.2rem;
  transform: translateZ(12px);
  font-weight: 500;
}
.project-card p {
  margin: 0.2rem 0 0.8rem;
  font-size: 0.85rem;
  opacity: 0.6;
  transform: translateZ(8px);
  line-height: 1.4;
}
.project-card .btn {
  display: inline-block;
  padding: 0.5rem 1.4rem;
  border-radius: 50px;
  font-weight: 500;
  text-decoration: none;
  background: rgba(76,151,255,0.7);
  backdrop-filter: blur(4px);
  color: #fff;
  transition: all 0.25s ease;
  border: 1px solid rgba(255,255,255,0.06);
  cursor: pointer;
  font-size: 0.85rem;
  transform: translateZ(16px);
  box-shadow: none !important;
}
.project-card .btn:hover {
  background: #4C97FF;
  transform: translateZ(20px) scale(1.02);
  border-color: rgba(255,255,255,0.1);
}

/* ===== 控件 ===== */
.glass-toggle {
  position: fixed; top: 16px; right: 16px; z-index: 9999;
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(30,35,65,0.2); backdrop-filter: blur(12px);
  cursor: pointer; border: 1px solid rgba(255,255,255,0.04);
  display: flex; align-items: center; justify-content: center;
  box-shadow: none;
}
.glass-toggle svg { width: 22px; height: 22px; fill: #fff; }

.download-float {
  position: fixed; right: 24px; bottom: 24px; z-index: 9999;
}
.download-trigger {
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(30,35,65,0.2); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.04); cursor: pointer;
  box-shadow: none;
}
.download-trigger svg { width: 24px; height: 24px; fill: #fff; }
.download-panel {
  position: absolute; right: 0; bottom: 70px;
  width: 280px; padding: 16px; display: none;
  backdrop-filter: blur(16px);
  background: rgba(25,30,55,0.4);
  border-radius: 16px; border: 1px solid rgba(255,255,255,0.03);
  max-height: 400px; overflow-y: auto;
  box-shadow: none;
}
.download-panel h4 { margin-top: 0; margin-bottom: 12px; color: #fff; font-weight: 400; }
.download-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; border-radius: 10px; font-size: 14px;
  margin-bottom: 6px; color: #fff; background: rgba(255,255,255,0.02);
}
.download-item .info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.download-item .info .title { font-weight: 500; font-size: 13px; }
.download-item .info .desc { font-size: 11px; opacity: 0.5; }
.download-item a {
  padding: 4px 14px; background: var(--blue); color: #fff;
  border-radius: 20px; text-decoration: none; font-size: 12px;
  flex-shrink: 0; margin-left: 8px;
}
.download-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,0.15);
  z-index: 9998; display: none;
}

header {
  text-align: center; padding: 2rem 1rem;
  background: linear-gradient(135deg, rgba(50,80,180,0.15), rgba(80,60,140,0.15));
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.02);
  box-shadow: none;
}
header h1 {
  color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,0.08);
  margin: 0; font-size: 1.8rem; font-weight: 500;
}

#projectContainer { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
.section-title {
  font-size: 1.3rem; border-left: 3px solid var(--orange);
  padding-left: 12px; margin-bottom: 0.4rem;
  color: #fff; font-weight: 400;
}
.project-list {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.8rem; perspective: 1200px; margin-bottom: 2rem;
}
.loading-placeholder {
  text-align: center; padding: 40px; color: rgba(255,255,255,0.3); font-size: 16px;
}

@media (max-width: 768px) {
  .project-list { gap: 1.25rem; }
  .download-panel { width: 240px; right: 0; }
  header h1 { font-size: 1.4rem; }
  .project-card { padding: 1rem; }
}
</style>
</head>

<body class="glass-on">

<div class="glass-toggle" id="glassToggle">
  <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h11v2zm0-4H6V7h11v2z"/></svg>
</div>

<header class="glass">
  <h1>作品集</h1>
</header>

<div id="projectContainer"><div class="loading-placeholder">⏳ 加载中...</div></div>

<div class="download-mask" id="mask"></div>
<div class="download-float">
  <button class="download-trigger glass" id="downloadBtn">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
  </button>
  <div class="download-panel glass" id="panel">
    <h4>下载</h4>
    <div id="downloadList"><div style="color:rgba(255,255,255,0.3); text-align:center; padding:10px;">加载中...</div></div>
  </div>
</div>

<script>
// ============================================================
// 1. 配置
// ============================================================
const API_BASE = '';

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
// 2. 加载并渲染作品
// ============================================================
async function loadProjects() {
  const container = document.getElementById('projectContainer');
  if (!container) return;
  container.innerHTML = '<div class="loading-placeholder">⏳ 加载中...</div>';
  
  try {
    const res = await fetch(`${API_BASE}/api/projects`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const projects = await res.json();
    renderProjects(projects, container);
  } catch (e) {
    console.error('加载失败:', e);
    container.innerHTML = `<div style="color:#FF6B6B; text-align:center; padding:40px;">⚠️ 加载失败</div>`;
  }
}

function renderProjects(projects, container) {
  const groups = {};
  projects.forEach(p => {
    const catName = p.category_name || '未分类';
    if (!groups[catName]) groups[catName] = [];
    groups[catName].push(p);
  });

  const categoryNames = Object.keys(groups);
  container.innerHTML = '';

  if (categoryNames.length === 0) {
    container.innerHTML = `<div style="color:rgba(255,255,255,0.3); text-align:center; padding:40px;">暂无作品</div>`;
    return;
  }

  categoryNames.forEach(catName => {
    const projectsInCat = groups[catName];
    const section = document.createElement('div');
    section.className = 'container';
    section.style.maxWidth = '1200px';
    section.style.margin = '0 auto 2rem auto';
    section.style.padding = '0 1rem';
    
    const title = document.createElement('h2');
    title.className = 'section-title';
    title.textContent = catName;
    section.appendChild(title);
    
    const list = document.createElement('div');
    list.className = 'project-list';
    list.innerHTML = projectsInCat.map(p => `
      <div class="project-card" data-tilt>
        <div class="project-image">
          <img src="${p.image || 'https://placehold.co/400x200?text=No+Image'}" alt="${p.title}" loading="lazy" onerror="this.src='https://placehold.co/400x200?text=加载失败'">
        </div>
        <h3>${escapeHtml(p.title)}</h3>
        <p>${escapeHtml(p.description || '')}</p>
        <a href="${escapeHtml(p.link)}" class="btn" target="_blank">查看</a>
      </div>
    `).join('');
    
    section.appendChild(list);
    container.appendChild(section);
  });

  bindTiltEffects();
}

// ============================================================
// 3. 3D 倾斜（保留交互，但不影响反射）
// ============================================================
function bindTiltEffects() {
  const cards = document.querySelectorAll('.project-card[data-tilt]');
  
  cards.forEach(card => {
    let rafId = null;
    let currentRotateX = 0, targetRotateX = 0;
    let currentRotateY = 0, targetRotateY = 0;
    
    function animate() {
      const ease = 0.10;
      currentRotateX += (targetRotateX - currentRotateX) * ease;
      currentRotateY += (targetRotateY - currentRotateY) * ease;
      
      card.style.transform = `
        perspective(900px) 
        rotateX(${currentRotateX * 0.4}deg) 
        rotateY(${currentRotateY * 0.4}deg)
      `;
      rafId = requestAnimationFrame(animate);
    }
    
    if (!card._animStarted) {
      card._animStarted = true;
      animate();
    }
    
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      const dx = (x - 0.5) * 2;
      const dy = (y - 0.5) * 2;
      targetRotateX = -dy * 10;
      targetRotateY = dx * 10;
    });
    
    card.addEventListener('mouseleave', () => {
      targetRotateX = 0;
      targetRotateY = 0;
    });
  });
}

// ============================================================
// 4. 下载加载
// ============================================================
async function loadDownloads() {
  const container = document.getElementById('downloadList');
  if (!container) return;
  try {
    const res = await fetch(`${API_BASE}/api/downloads`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const downloads = await res.json();
    if (downloads.length === 0) {
      container.innerHTML = `<div style="color:rgba(255,255,255,0.3); text-align:center; padding:10px;">暂无</div>`;
      return;
    }
    container.innerHTML = downloads.map(item => `
      <div class="download-item">
        <div class="info">
          <span class="title">${escapeHtml(item.title)}</span>
          ${item.description ? `<span class="desc">${escapeHtml(item.description)}</span>` : ''}
        </div>
        <a href="${escapeHtml(item.link)}" target="_blank">${escapeHtml(item.link_text || '下载')}</a>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = `<div style="color:#FF6B6B; text-align:center; padding:10px;">⚠️ 加载失败</div>`;
  }
}

// ============================================================
// 5. 控件
// ============================================================
document.getElementById('glassToggle').onclick = () => {
  document.body.classList.toggle('glass-on');
  document.body.classList.toggle('glass-off');
};

const btn = document.getElementById('downloadBtn');
const panel = document.getElementById('panel');
const mask = document.getElementById('mask');

btn.onclick = () => {
  const show = panel.style.display === 'block';
  panel.style.display = show ? 'none' : 'block';
  mask.style.display = show ? 'none' : 'block';
  if (!show) loadDownloads();
};
mask.onclick = () => {
  panel.style.display = 'none';
  mask.style.display = 'none';
};

// ============================================================
// 6. 启动
// ============================================================
loadProjects();
loadDownloads();
console.log('🚀 作品集已启动（光学边缘反射 + 无阴影）');
</script>
</body>
</html>
