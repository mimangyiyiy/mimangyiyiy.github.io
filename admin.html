<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a1a;
  color: #fff;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}
.container { max-width: 1000px; margin: 0 auto; }
h1, h2, h3 { margin-top: 0; }
.card {
  background: #1a1a2e;
  padding: 24px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  animation: cardFadeIn 0.4s ease both;
}
.card:hover {
  border-color: rgba(255,255,255,0.12);
  box-shadow: 0 4px 24px rgba(0,0,0,0.2);
}
input, select, textarea {
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 10px;
  border: 1px solid #333;
  border-radius: 8px;
  background: #2a2a4e;
  color: #fff;
  font-size: 14px;
  box-sizing: border-box;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
input:focus, select:focus, textarea:focus {
  border-color: #4C97FF;
  outline: none;
  background: #33335a;
  box-shadow: 0 0 0 3px rgba(76,151,255,0.15);
  transform: scale(1.002);
}
input::placeholder { color: #888; }
select option { background: #2a2a4e; }
.btn {
  padding: 10px 22px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  position: relative;
  overflow: hidden;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: #4C97FF; color: #fff; }
.btn-primary:hover { background: #3a7be0; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(76,151,255,0.3); }
.btn-success { background: #4CAF50; color: #fff; }
.btn-success:hover { background: #3d8b40; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(76,175,80,0.3); }
.btn-warning { background: #FFAB19; color: #222; }
.btn-warning:hover { background: #e89a0f; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,171,25,0.3); }
.btn-danger { background: #FF6B6B; color: #fff; }
.btn-danger:hover { background: #e55a5a; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,107,0.3); }
.btn-secondary { background: #555; color: #fff; }
.btn-secondary:hover { background: #444; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(85,85,85,0.3); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
  animation: slideDown 0.4s ease both;
}
.project-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #2a2a4e;
  margin-bottom: 8px;
  gap: 10px;
  border-radius: 8px;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  animation: listItemIn 0.3s ease both;
}
.project-item:hover {
  background: #33335a;
  transform: translateX(4px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.project-item .info {
  flex: 1;
  min-width: 0;
}
.project-item .info .title {
  font-weight: bold;
  display: block;
}
.project-item .info .sub {
  font-size: 12px;
  opacity: 0.6;
  display: block;
}
.project-item .actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.empty-msg {
  color: #888;
  text-align: center;
  padding: 30px;
}
#loginArea { display: block; }
#adminArea { display: none; }
.status-msg {
  padding: 10px 16px;
  margin-bottom: 10px;
  border-radius: 8px;
  display: none;
  animation: slideDown 0.3s ease both;
}
.status-msg.success { background: rgba(76,175,80,0.2); color: #81C784; display: block; }
.status-msg.error { background: rgba(255,107,107,0.2); color: #FF6B6B; display: block; }
.upload-area {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.upload-area input[type="file"] {
  flex: 1;
  min-width: 150px;
  padding: 8px;
  border-radius: 8px;
  background: #2a2a4e;
  border: 1px solid #333;
  color: #fff;
  margin-bottom: 0;
  transition: all 0.3s ease;
}
.upload-area input[type="file"]:hover { border-color: #555; }
.upload-area .btn { flex-shrink: 0; }
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  border-radius: 10px;
  background: #12121f;
  padding: 4px;
}
.tab-btn {
  flex: 1;
  padding: 12px 16px;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: #888;
  cursor: pointer;
  font-weight: bold;
  font-size: 13px;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  min-width: 70px;
}
.tab-btn.active {
  background: #4C97FF;
  color: #fff;
  box-shadow: 0 4px 16px rgba(76,151,255,0.25);
  transform: scale(1.02);
}
.tab-btn:hover:not(.active) {
  background: #2a2a4e;
  color: #fff;
  transform: translateY(-1px);
}
.tab-content { display: none; animation: fadeIn 0.3s ease both; }
.tab-content.active { display: block; }
#editModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 99999;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(8px);
  animation: fadeIn 0.25s ease;
}
#editModal .modal-content {
  background: #1a1a2e;
  padding: 30px;
  max-width: 500px;
  width: 95%;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 16px;
  border: 1px solid #333;
  animation: modalPop 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}
#editModal .modal-content h3 { margin-top: 0; }
#editModal .modal-content input,
#editModal .modal-content select,
#editModal .modal-content textarea {
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #2a2a4e;
  color: #fff;
  font-size: 14px;
  box-sizing: border-box;
  transition: all 0.3s ease;
}
#editModal .modal-content textarea { resize: vertical; min-height: 60px; }
#editModal .modal-content .btn-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
#editModal .modal-content .btn-row .btn { flex: 1; }
.file-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: #2a2a4e;
  margin-bottom: 6px;
  gap: 10px;
  border-radius: 8px;
  transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
  animation: listItemIn 0.3s ease both;
}
.file-item:hover {
  background: #33335a;
  transform: translateX(4px) scale(1.003);
  box-shadow: 0 2px 16px rgba(0,0,0,0.15);
}
.file-item .info { flex: 1; min-width: 0; }
.file-item .info .name { font-size: 14px; word-break: break-all; }
.file-item .info .sub { font-size: 12px; opacity: 0.6; }
.file-item .actions { display: flex; gap: 6px; flex-shrink: 0; }
.hint { font-size: 12px; color: #888; margin-top: 4px; }
#imagePreview {
  display: none;
  margin-top: 8px;
  animation: fadeIn 0.3s ease both;
}
#imagePreview img { max-height: 120px; border-radius: 8px; border: 1px solid #333; }
#htmlUploadProgress, #uploadProgress {
  display: none;
  margin-top: 6px;
  font-size: 13px;
  color: #4C97FF;
  animation: fadeIn 0.3s ease both;
}
.kv-content {
  background: #0d0d20;
  padding: 16px;
  border-radius: 10px;
  font-family: monospace;
  font-size: 13px;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 400px;
  overflow: auto;
  border: 1px solid #333;
  margin-top: 10px;
}
.progress-bar-wrap {
  background: #2a2a4e;
  overflow: hidden;
  height: 8px;
  margin: 8px 0 4px;
  border-radius: 4px;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #4C97FF, #6C5CE7, #a855f7);
  width: 0%;
  border-radius: 4px;
  transition: width 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
}
.kv-stats {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #888;
  margin-bottom: 4px;
}
.file-load-progress {
  display: none;
  margin-top: 8px;
  padding: 8px 12px;
  background: #2a2a4e;
  border-radius: 8px;
  font-size: 13px;
  color: #4C97FF;
  animation: fadeIn 0.3s ease both;
}
.file-load-progress .bar-wrap {
  background: #1a1a2e;
  overflow: hidden;
  height: 4px;
  margin-top: 6px;
  border-radius: 2px;
}
.file-load-progress .bar-wrap .bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #4C97FF, #a855f7);
  width: 0%;
  border-radius: 2px;
  transition: width 0.3s ease;
}
#kvModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 99998;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(8px);
  animation: fadeIn 0.25s ease;
}
#kvModal .kv-modal-content {
  background: #1a1a2e;
  padding: 30px;
  max-width: 700px;
  width: 95%;
  max-height: 90vh;
  border-radius: 16px;
  border: 1px solid #333;
  overflow-y: auto;
  animation: modalPop 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}
#kvModal .kv-modal-content h3 { margin-top: 0; }

#fileToastContainer {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 999999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 380px;
  width: 100%;
  pointer-events: none;
}
.toast-item {
  background: #1a1a2e;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 14px 16px;
  color: #fff;
  font-size: 13px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
  transform: translateY(20px);
  opacity: 0;
  pointer-events: auto;
  animation: toastIn 0.3s ease forwards;
}
.toast-item .toast-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.toast-item .toast-title {
  font-weight: bold;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.toast-item .toast-close {
  background: transparent;
  border: none;
  color: #888;
  cursor: pointer;
  font-size: 16px;
  padding: 0 4px;
  transition: color 0.2s;
  flex-shrink: 0;
}
.toast-item .toast-close:hover { color: #fff; }
.toast-item .toast-body {
  font-size: 12px;
  color: #aaa;
  margin-top: 2px;
}
.toast-item .toast-progress-wrap {
  margin-top: 6px;
  background: #2a2a4e;
  border-radius: 4px;
  overflow: hidden;
  height: 4px;
}
.toast-item .toast-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #4C97FF, #a855f7);
  width: 0%;
  border-radius: 4px;
  transition: width 0.3s ease;
}
.toast-item.complete .toast-progress-fill {
  background: linear-gradient(90deg, #4CAF50, #66BB6A);
}
.toast-item.error .toast-progress-fill {
  background: #FF6B6B;
}
@keyframes toastIn {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes toastOut {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(20px); opacity: 0; }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes modalPop {
  0% { opacity: 0; transform: scale(0.9) translateY(20px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes listItemIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 8px;
  background: radial-gradient(circle at center, rgba(255,255,255,0.2), transparent 70%);
  opacity: 0;
  transition: opacity 0.4s ease;
}
.btn:hover::after { opacity: 1; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #1a1a2e; border-radius: 3px; }
::-webkit-scrollbar-thumb { background: #4C97FF; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a7be0; }
</style>
</head>
<body>
<div class="container">
  <h1>管理后台</h1>
  <div id="statusMsg" class="status-msg"></div>
  <div id="loginArea" class="card">
    <h2>管理员登录</h2>
    <input id="loginUser" placeholder="用户名" autocomplete="username">
    <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn btn-primary" onclick="adminLogin()" style="width:100%;">登录</button>
  </div>
  <div id="adminArea">
    <div class="header-bar">
      <h2 style="margin:0;">管理</h2>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn btn-secondary btn-sm" onclick="requestNotificationPermission()" id="notifBtn">🔔 允许通知</button>
        <button class="btn btn-danger" onclick="logout()">退出</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-projects" onclick="switchTab('tab-projects')">作品</button>
      <button class="tab-btn" data-tab="tab-downloads" onclick="switchTab('tab-downloads')">下载</button>
      <button class="tab-btn" data-tab="tab-files" onclick="switchTab('tab-files')">文件</button>
      <button class="tab-btn" data-tab="tab-categories" onclick="switchTab('tab-categories')">分类</button>
    </div>
    <div id="tab-projects" class="tab-content active">
      <div class="card">
        <h3>添加作品</h3>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:4px; font-size:14px; color:#aaa;">作品文件 (.html)</label>
          <div class="upload-area">
            <input type="file" id="newHtmlFile" accept=".html">
            <button class="btn btn-primary" onclick="uploadHtmlFile()">上传作品</button>
          </div>
          <div id="htmlUploadProgress">上传中...</div>
          <input id="newLink" placeholder="或手动输入作品链接 *" style="margin-top:8px;">
          <div class="hint">上传 .html 文件后会自动填入链接</div>
        </div>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:4px; font-size:14px; color:#aaa;">作品封面图片</label>
          <div class="upload-area">
            <input type="file" id="newImageFile" accept="image/*">
            <button class="btn btn-primary" onclick="uploadImageToKV()">上传图片到KV</button>
          </div>
          <div id="uploadProgress">上传中...</div>
          <div id="imagePreview"><img id="previewImg" src="" alt="预览"></div>
          <input id="newImage" placeholder="或手动输入图片URL" style="margin-top:8px;">
          <div class="hint">支持 JPG / PNG / WebP / GIF</div>
        </div>
        <input id="newTitle" placeholder="标题 *">
        <input id="newDesc" placeholder="描述">
        <select id="newCategory"></select>
        <button class="btn btn-success" onclick="addProject()" style="width:100%;">添加作品</button>
      </div>
      <div class="card">
        <h3>所有作品</h3>
        <div id="projectListAdmin"><div class="empty-msg">加载中...</div></div>
      </div>
    </div>
    <div id="tab-downloads" class="tab-content">
      <div class="card">
        <h3>添加下载项</h3>
        <input id="newDownloadTitle" placeholder="标题 *">
        <input id="newDownloadDesc" placeholder="描述（可选）">
        <input id="newDownloadLink" placeholder="链接 *">
        <input id="newDownloadLinkText" placeholder="按钮文字（默认：下载）" value="下载">
        <button class="btn btn-success" onclick="addDownload()" style="width:100%;">添加下载项</button>
      </div>
      <div class="card">
        <h3>所有下载项</h3>
        <div id="downloadListAdmin"><div class="empty-msg">加载中...</div></div>
      </div>
    </div>
    <div id="tab-files" class="tab-content">
      <div class="card">
        <h3>KV 文件管理</h3>
        <div style="margin-bottom:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="loadFiles()">刷新</button>
          <span id="fileCount" style="font-size:13px; color:#888;"></span>
        </div>
        <div class="kv-stats">
          <span id="kvUsed">已用: 0 KB</span>
          <span id="kvTotal">总量: 1024000 KB</span>
          <span id="kvPercent">0%</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="kvProgress"></div>
        </div>
        <div class="file-load-progress" id="fileLoadProgress">
          <span id="fileLoadText">加载文件中...</span>
          <div class="bar-wrap">
            <div class="bar-fill" id="fileLoadBar"></div>
          </div>
        </div>
        <div id="fileList" style="margin-top:12px;"><div class="empty-msg">点击刷新加载...</div></div>
      </div>
    </div>
    <div id="tab-categories" class="tab-content">
      <div class="card">
        <h3>管理分类</h3>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
          <input id="newCategoryName" placeholder="新分类名称" style="flex:1; margin-bottom:0;">
          <button class="btn btn-success" onclick="addCategory()" style="flex-shrink:0;">添加</button>
        </div>
        <div id="categoryList"><div class="empty-msg">加载中...</div></div>
      </div>
    </div>
  </div>
</div>
<div id="editModal">
  <div class="modal-content">
    <h3 id="editModalTitle">编辑</h3>
    <input id="editId" type="hidden">
    <div id="editFields"></div>
    <div class="btn-row">
      <button class="btn btn-success" onclick="saveEdit()">保存修改</button>
      <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
    </div>
  </div>
</div>
<div id="kvModal">
  <div class="kv-modal-content">
    <h3 id="kvModalTitle">文件内容</h3>
    <div id="kvModalBody" class="kv-content">加载中...</div>
    <div style="margin-top:15px; text-align:right;">
      <button class="btn btn-secondary" onclick="document.getElementById('kvModal').style.display='none'">关闭</button>
    </div>
  </div>
</div>
<div id="fileToastContainer"></div>

<script>
// ============================================================
// 1. 配置
// ============================================================
const API_BASE = '';
const KV_LIMIT_KB = 1024 * 1024;
let editType = '';
let editId = null;
const fileCache = new Map();
const loadingFiles = new Map();

// ============================================================
// 2. 工具函数
// ============================================================
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showStatus(msg, type = 'success') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
  setTimeout(() => { el.className = 'status-msg'; }, 4000);
}

function getToken() {
  return localStorage.getItem('adminToken');
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
  if (tabId === 'tab-files') loadFiles();
  if (tabId === 'tab-downloads') loadAdminDownloads();
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// ============================================================
// 3. 系统通知（简化版，只发开始和完成）
// ============================================================
function sendSystemNotification(title, body, tag, silent = false) {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  try {
    const notif = new Notification('📄 ' + title, {
      body: body,
      icon: '📄',
      silent: silent,
      requireInteraction: !silent,
      tag: tag || 'notif-' + Date.now()
    });
    notif.onclick = function() {
      window.focus();
      notif.close();
    };
    setTimeout(() => { try { notif.close(); } catch(e) {} }, silent ? 3000 : 6000);
  } catch (e) {
    console.log('系统通知发送失败:', e);
  }
}

async function requestNotificationPermission() {
  if (!('Notification' in window)) {
    showStatus('❌ 您的浏览器不支持通知', 'error');
    return;
  }
  if (Notification.permission === 'granted') {
    showStatus('✅ 通知已授权', 'success');
    document.getElementById('notifBtn').textContent = '🔔 已授权';
    sendSystemNotification('✅ 通知已启用', '您将收到所有操作通知', 'notif-test');
    return;
  }
  if (Notification.permission === 'denied') {
    showStatus('❌ 通知已被拒绝，请在浏览器设置中允许', 'error');
    return;
  }
  try {
    const result = await Notification.requestPermission();
    if (result === 'granted') {
      showStatus('✅ 通知授权成功', 'success');
      document.getElementById('notifBtn').textContent = '🔔 已授权';
      sendSystemNotification('✅ 通知已启用', '您将收到所有操作通知', 'notif-test');
    } else {
      showStatus('❌ 通知授权被拒绝', 'error');
    }
  } catch (e) {
    showStatus('❌ 请求通知权限失败: ' + e.message, 'error');
  }
}

// ============================================================
// 4. 右下角通知
// ============================================================
function createFileToast(id, title, totalSizeKB) {
  const container = document.getElementById('fileToastContainer');
  if (!container) return null;
  const toast = document.createElement('div');
  toast.className = 'toast-item';
  toast.dataset.id = id;
  toast.innerHTML = `
    <div class="toast-header">
      <span class="toast-title">📄 ${escapeHtml(title)}</span>
      <button class="toast-close" onclick="closeToast('${id}')">✕</button>
    </div>
    <div class="toast-body">0.0 KB / ${totalSizeKB.toFixed(1)} KB</div>
    <div class="toast-progress-wrap">
      <div class="toast-progress-fill" style="width:0%"></div>
    </div>
  `;
  container.appendChild(toast);
  return toast;
}

function updateToast(id, loadedKB, totalKB, status = 'loading') {
  const container = document.getElementById('fileToastContainer');
  if (!container) return;
  const toast = container.querySelector(`.toast-item[data-id="${id}"]`);
  if (!toast) return;
  const body = toast.querySelector('.toast-body');
  const fill = toast.querySelector('.toast-progress-fill');
  if (body) {
    if (status === 'complete') {
      body.textContent = `✅ 完成 · ${loadedKB.toFixed(1)} KB / ${totalKB.toFixed(1)} KB`;
    } else if (status === 'error') {
      body.textContent = `❌ 加载失败`;
    } else {
      const percent = Math.min((loadedKB / totalKB) * 100, 100);
      body.textContent = `${loadedKB.toFixed(1)} KB / ${totalKB.toFixed(1)} KB (${percent.toFixed(0)}%)`;
    }
  }
  if (fill) {
    if (status === 'complete') {
      fill.style.width = '100%';
      toast.classList.add('complete');
    } else if (status === 'error') {
      toast.classList.add('error');
    } else {
      const percent = Math.min((loadedKB / totalKB) * 100, 100);
      fill.style.width = percent + '%';
    }
  }
}

function closeToast(id) {
  const container = document.getElementById('fileToastContainer');
  if (!container) return;
  const toast = container.querySelector(`.toast-item[data-id="${id}"]`);
  if (toast) {
    toast.style.animation = 'toastOut 0.3s ease forwards';
    setTimeout(() => { toast.remove(); }, 300);
  }
}

function removeToast(id) {
  const container = document.getElementById('fileToastContainer');
  if (!container) return;
  const toast = container.querySelector(`.toast-item[data-id="${id}"]`);
  if (toast) {
    toast.style.animation = 'toastOut 0.3s ease forwards';
    setTimeout(() => { toast.remove(); }, 300);
  }
}

// ============================================================
// 9. viewKVWithProgress
// ============================================================
async function viewKVWithProgress(key) {
  if ('Notification' in window && Notification.permission === 'default') {
    await Notification.requestPermission();
    if (Notification.permission === 'granted') {
      document.getElementById('notifBtn').textContent = '🔔 已授权';
    }
  }

  if (loadingFiles.has(key)) {
    showStatus('文件正在加载中...', 'success');
    return;
  }

  if (fileCache.has(key)) {
    const data = fileCache.get(key);
    document.getElementById('kvModalTitle').textContent = key + ' (' + data.sizeKB + ')';
    document.getElementById('kvModalBody').textContent = data.value || '(空)';
    document.getElementById('kvModal').style.display = 'flex';
    showStatus('已从缓存加载', 'success');
    sendSystemNotification('✅ 缓存加载', `${key} (${data.sizeKB})`, 'cache-' + key, true);
    return;
  }

  try {
    const listRes = await fetch(`${API_BASE}/api/kv-list`);
    const listData = await listRes.json();
    const fileInfo = listData.keys.find(item => item.key === key);
    const totalSize = fileInfo ? fileInfo.size : 0;
    const totalSizeKB = totalSize / 1024;

    if (totalSize === 0) {
      const res = await fetch(`${API_BASE}/api/kv-get/${encodeURIComponent(key)}`);
      const data = await res.json();
      fileCache.set(key, data);
      document.getElementById('kvModalTitle').textContent = key + ' (' + data.sizeKB + ')';
      document.getElementById('kvModalBody').textContent = data.value || '(空)';
      document.getElementById('kvModal').style.display = 'flex';
      showStatus('加载完成', 'success');
      sendSystemNotification('✅ 加载完成', `${key} (${data.sizeKB})`, 'complete-' + key);
      return;
    }

    const toastId = 'toast-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
    loadingFiles.set(key, toastId);

    createFileToast(toastId, key, totalSizeKB);
    sendSystemNotification('⏳ 正在加载', `${key} (${totalSizeKB.toFixed(1)} KB)`, 'start-' + key);

    const progressEl = document.getElementById('fileLoadProgress');
    const progressBar = document.getElementById('fileLoadBar');
    const progressText = document.getElementById('fileLoadText');

    progressEl.style.display = 'block';
    progressText.textContent = `0.0 KB / ${totalSizeKB.toFixed(1)} KB`;
    progressBar.style.width = '10%';

    const res = await fetch(`${API_BASE}/api/kv-get/${encodeURIComponent(key)}`);
    if (!res.ok) {
      const err = await res.json();
      showStatus('加载失败：' + (err.error || '未知错误'), 'error');
      progressEl.style.display = 'none';
      progressBar.style.width = '0%';
      updateToast(toastId, 0, totalSizeKB, 'error');
      sendSystemNotification('❌ 加载失败', `${key} ${err.error || '未知错误'}`, 'error-' + key);
      loadingFiles.delete(key);
      setTimeout(() => removeToast(toastId), 3000);
      return;
    }

    const reader = res.body.getReader();
    let receivedLength = 0;
    const chunks = [];
    let lastNotify = Date.now();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      receivedLength += value.length;

      const percent = (receivedLength / totalSize) * 100;
      progressBar.style.width = Math.min(percent, 99) + '%';
      const displayKB = receivedLength / 1024;
      progressText.textContent = `${displayKB.toFixed(1)} KB / ${totalSizeKB.toFixed(1)} KB`;

      const now = Date.now();
      if (now - lastNotify > 500) {
        lastNotify = now;
        updateToast(toastId, displayKB, totalSizeKB);
      }
    }

    const allChunks = new Uint8Array(receivedLength);
    let position = 0;
    for (const chunk of chunks) {
      allChunks.set(chunk, position);
      position += chunk.length;
    }

    const decoder = new TextDecoder('utf-8');
    const text = decoder.decode(allChunks);
    const data = JSON.parse(text);
    fileCache.set(key, data);
    loadingFiles.delete(key);

    progressBar.style.width = '100%';
    const finalKB = receivedLength / 1024;
    progressText.textContent = `完成 · ${finalKB.toFixed(1)} KB / ${totalSizeKB.toFixed(1)} KB`;

    updateToast(toastId, finalKB, totalSizeKB, 'complete');
    sendSystemNotification('✅ 加载完成', `${key} (${finalKB.toFixed(1)} / ${totalSizeKB.toFixed(1)} KB)`, 'complete-' + key);

    setTimeout(() => {
      document.getElementById('kvModalTitle').textContent = key + ' (' + data.sizeKB + ')';
      document.getElementById('kvModalBody').textContent = data.value || '(空)';
      document.getElementById('kvModal').style.display = 'flex';
      setTimeout(() => {
        progressEl.style.display = 'none';
        progressBar.style.width = '0%';
        removeToast(toastId);
      }, 500);
    }, 200);

  } catch (e) {
    showStatus('加载失败：' + (e.message || '未知错误'), 'error');
    const toastId = loadingFiles.get(key);
    if (toastId) {
      updateToast(toastId, 0, 0, 'error');
      setTimeout(() => removeToast(toastId), 3000);
    }
    loadingFiles.delete(key);
    sendSystemNotification('❌ 加载失败', `${key} ${e.message || '未知错误'}`, 'error-' + key);
  }
}

// ============================================================
// 10. loadFiles
// ============================================================
async function loadFiles() {
  const container = document.getElementById('fileList');
  const countEl = document.getElementById('fileCount');
  const progressEl = document.getElementById('fileLoadProgress');
  const progressBar = document.getElementById('fileLoadBar');
  const progressText = document.getElementById('fileLoadText');

  container.innerHTML = '<div class="empty-msg">加载中...</div>';
  progressEl.style.display = 'block';
  progressText.textContent = '正在连接...';
  progressBar.style.width = '5%';

  try {
    const res = await fetch(`${API_BASE}/api/kv-list`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const contentLength = res.headers.get('Content-Length');
    const totalSize = contentLength ? parseInt(contentLength) : 0;
    const totalSizeKB = totalSize / 1024;
    const totalSizeKnown = totalSize > 0;

    progressText.textContent = totalSizeKnown ?
      `0.0 KB / ${totalSizeKB.toFixed(1)} KB` :
      '正在加载...';
    progressBar.style.width = '10%';

    const reader = res.body.getReader();
    let receivedLength = 0;
    const chunks = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      receivedLength += value.length;

      if (totalSizeKnown) {
        const percent = (receivedLength / totalSize) * 100;
        progressBar.style.width = Math.min(percent, 99) + '%';
        const displayKB = (receivedLength / 1024).toFixed(1);
        progressText.textContent = `${displayKB} KB / ${totalSizeKB.toFixed(1)} KB`;
      }
    }

    const allChunks = new Uint8Array(receivedLength);
    let position = 0;
    for (const chunk of chunks) {
      allChunks.set(chunk, position);
      position += chunk.length;
    }

    const decoder = new TextDecoder('utf-8');
    const text = decoder.decode(allChunks);
    const data = JSON.parse(text);

    const finalKB = receivedLength / 1024;
    const totalKB = totalSizeKnown ? totalSizeKB.toFixed(1) : finalKB.toFixed(1);
    progressBar.style.width = '100%';
    progressText.textContent = `完成 · ${finalKB.toFixed(1)} KB / ${totalKB} KB`;
    setTimeout(() => {
      progressEl.style.display = 'none';
      progressBar.style.width = '0%';
    }, 500);

    countEl.textContent = '共 ' + data.total + ' 个文件';

    let totalSizeKB_sum = 0;
    data.keys.forEach(item => { totalSizeKB_sum += (item.size || 0) / 1024; });
    const percent = Math.min((totalSizeKB_sum / KV_LIMIT_KB) * 100, 100);

    document.getElementById('kvUsed').textContent = '已用: ' + totalSizeKB_sum.toFixed(1) + ' KB';
    document.getElementById('kvPercent').textContent = percent.toFixed(1) + '%';
    document.getElementById('kvProgress').style.width = percent + '%';

    if (data.keys.length === 0) {
      container.innerHTML = '<div class="empty-msg">KV 中暂无文件</div>';
      return;
    }

    container.innerHTML = data.keys.map((item, index) => {
      const ext = item.key.split('.').pop().toLowerCase();
      const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext);
      const icon = isImage ? '🖼️' : '📄';
      const previewUrl = `/api/kv-get/${encodeURIComponent(item.key)}`;
      const sizeKB = ((item.size || 0) / 1024).toFixed(1);
      const delay = index * 40;

      return `
      <div class="file-item" style="animation-delay:${delay}ms">
        <div class="info">
          <span class="name">${icon} ${escapeHtml(item.key)}</span>
          <span class="sub">${sizeKB} KB · ${isImage ? '图片' : '文件'}</span>
        </div>
        <div class="actions">
          ${isImage ? `<a href="${previewUrl}" target="_blank" class="btn btn-primary btn-sm">查看</a>` : `<button class="btn btn-primary btn-sm" onclick="viewKVWithProgress('${escapeHtml(item.key)}')">查看</button>`}
          <button class="btn btn-danger btn-sm" onclick="deleteFileKV('${escapeHtml(item.key)}')">删除</button>
        </div>
      </div>
    `}).join('');

  } catch (e) {
    container.innerHTML = '<div class="empty-msg">加载失败：' + (e.message || '未知错误') + '</div>';
    progressEl.style.display = 'none';
    progressBar.style.width = '0%';
  }
}

// ============================================================
// 11. 删除 KV 文件
// ============================================================
async function deleteFileKV(key) {
  if (!confirm('确定要删除 "' + key + '" 吗？此操作不可恢复！')) return;
  fileCache.delete(key);
  try {
    const res = await fetch(`${API_BASE}/api/kv-delete/${encodeURIComponent(key)}`, {
      method: 'DELETE'
    });
    if (res.ok) {
      showStatus('已删除', 'success');
      loadFiles();
      sendSystemNotification('🗑️ 文件删除', `已删除文件: ${key}`, 'file-delete');
    } else {
      const err = await res.json();
      showStatus('删除失败：' + (err.error || '未知错误'), 'error');
    }
  } catch (e) {
    showStatus('网络错误', 'error');
  }
}

// ============================================================
// 12. 上传功能
// ============================================================
async function uploadHtmlFile() {
  const fileInput = document.getElementById('newHtmlFile');
  const file = fileInput.files[0];
  if (!file) { showStatus('请先选择 .html 文件', 'error'); return; }
  if (!file.name.endsWith('.html')) { showStatus('只支持 .html 文件', 'error'); return; }
  if (file.size > 10 * 1024 * 1024) { showStatus('文件大小不能超过 10MB', 'error'); return; }
  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }
  const progressEl = document.getElementById('htmlUploadProgress');
  progressEl.style.display = 'block';
  progressEl.textContent = '上传中...';
  try {
    const content = await file.text();
    const res = await fetch(`${API_BASE}/api/admin/upload-html`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ fileName: file.name, content })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      document.getElementById('newLink').value = data.url;
      showStatus('作品文件上传成功', 'success');
      progressEl.textContent = '上传完成';
      sendSystemNotification('📄 文件上传', `已上传: ${file.name}`, 'html-upload');
    } else {
      showStatus('上传失败：' + (data.error || '未知错误'), 'error');
      progressEl.style.display = 'none';
    }
  } catch (e) {
    showStatus('上传失败：' + e.message, 'error');
    progressEl.style.display = 'none';
  }
  setTimeout(() => { progressEl.style.display = 'none'; }, 3000);
}

// 上传图片到 ImgBB
async function uploadImageToKV() {
  const fileInput = document.getElementById('newImageFile');
  const file = fileInput.files[0];
  if (!file) {
    showStatus('请先选择一张图片', 'error');
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showStatus('图片大小不能超过 5MB', 'error');
    return;
  }
  const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
  if (!validTypes.includes(file.type)) {
    showStatus('仅支持 JPG / PNG / WebP / GIF', 'error');
    return;
  }

  const progressEl = document.getElementById('uploadProgress');
  progressEl.style.display = 'block';
  progressEl.textContent = '上传到图床...';

  try {
    const base64 = await fileToBase64(file);
    const base64Data = base64.split(',')[1];
    
    // 使用免费 ImgBB API
    const formData = new FormData();
    formData.append('key', '152e30b5914fa4ee74371fab84a848bb');  // 替换为你的 API Key
    formData.append('image', base64Data);
    formData.append('name', file.name);

    const response = await fetch('https://api.imgbb.com/1/upload', {
      method: 'POST',
      body: formData
    });

    const data = await response.json();

    if (data.success) {
      const imageUrl = data.data.url;
      document.getElementById('newImage').value = imageUrl;
      const preview = document.getElementById('imagePreview');
      const previewImg = document.getElementById('previewImg');
      previewImg.src = imageUrl;
      preview.style.display = 'block';
      showStatus('图片上传成功', 'success');
      progressEl.textContent = '上传完成';
      sendSystemNotification('🖼️ 图片上传', `已上传图片: ${file.name}`, 'image-upload');
    } else {
      showStatus('上传失败：' + (data.error?.message || '未知错误'), 'error');
      progressEl.style.display = 'none';
    }
  } catch (e) {
    showStatus('上传失败：' + e.message, 'error');
    progressEl.style.display = 'none';
  }
  setTimeout(() => { progressEl.style.display = 'none'; }, 3000);
}

document.addEventListener('DOMContentLoaded', function() {
  const fileInput = document.getElementById('newImageFile');
  if (fileInput) {
    fileInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById('imagePreview');
          const previewImg = document.getElementById('previewImg');
          previewImg.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });
  }
});

// ============================================================
// 13. 编辑弹窗
// ============================================================
function openEditDownload(id) {
  editType = 'download';
  editId = id;
  document.getElementById('editModalTitle').textContent = '编辑下载项';
  fetch(`${API_BASE}/api/downloads`)
    .then(r => r.json())
    .then(data => {
      const item = data.find(d => d.id === id);
      if (!item) { showStatus('未找到该下载项', 'error'); return; }
      document.getElementById('editFields').innerHTML = `
        <input id="editDownloadTitle" value="${escapeHtml(item.title)}" placeholder="标题 *">
        <input id="editDownloadDesc" value="${escapeHtml(item.description || '')}" placeholder="描述（可选）">
        <input id="editDownloadLink" value="${escapeHtml(item.link)}" placeholder="链接 *">
        <input id="editDownloadLinkText" value="${escapeHtml(item.link_text || '下载')}" placeholder="按钮文字">
      `;
      document.getElementById('editModal').style.display = 'flex';
    })
    .catch(() => showStatus('加载数据失败', 'error'));
}

function openEditProject(id) {
  editType = 'project';
  editId = id;
  document.getElementById('editModalTitle').textContent = '编辑作品';
  fetch(`${API_BASE}/api/projects`)
    .then(r => r.json())
    .then(data => {
      const item = data.find(p => p.id === id);
      if (!item) { showStatus('未找到该作品', 'error'); return; }
      document.getElementById('editFields').innerHTML = `
        <input id="editProjectTitle" value="${escapeHtml(item.title)}" placeholder="标题 *">
        <input id="editProjectDesc" value="${escapeHtml(item.description || '')}" placeholder="描述">
        <input id="editProjectLink" value="${escapeHtml(item.link)}" placeholder="链接 *">
        <input id="editProjectImage" value="${escapeHtml(item.image || '')}" placeholder="图片URL">
        <select id="editProjectCategory"></select>
      `;
      fetch(`${API_BASE}/api/categories`)
        .then(r => r.json())
        .then(cats => {
          const select = document.getElementById('editProjectCategory');
          select.innerHTML = cats.map(c =>
            '<option value="' + c.id + '" ' + (c.id === item.category_id ? 'selected' : '') + '>' + escapeHtml(c.name) + '</option>'
          ).join('');
        });
      document.getElementById('editModal').style.display = 'flex';
    })
    .catch(() => showStatus('加载数据失败', 'error'));
}

async function saveEdit() {
  const token = getToken();
  if (!token) { showStatus('请先登录', 'error'); return; }
  if (editType === 'download') {
    const title = document.getElementById('editDownloadTitle').value.trim();
    const link = document.getElementById('editDownloadLink').value.trim();
    if (!title || !link) { showStatus('标题和链接为必填项', 'error'); return; }
    const data = {
      title,
      description: document.getElementById('editDownloadDesc').value.trim(),
      link,
      link_text: document.getElementById('editDownloadLinkText').value.trim() || '下载'
    };
    try {
      const res = await fetch(`${API_BASE}/api/admin/downloads/${editId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        showStatus('下载项已更新', 'success');
        closeEditModal();
        loadAdminDownloads();
        sendSystemNotification('✏️ 下载项编辑', `已更新下载项 ID: ${editId}`, 'download-edit');
      } else {
        const err = await res.json();
        showStatus('更新失败：' + (err.error || '未知错误'), 'error');
      }
    } catch (e) {
      showStatus('网络错误', 'error');
    }
  } else if (editType === 'project') {
    const title = document.getElementById('editProjectTitle').value.trim();
    const link = document.getElementById('editProjectLink').value.trim();
    if (!title || !link) { showStatus('标题和链接为必填项', 'error'); return; }
    const data = {
      title,
      description: document.getElementById('editProjectDesc').value.trim(),
      link,
      image: document.getElementById('editProjectImage').value.trim() || 'https://placehold.co/400x200?text=作品封面',
      category_id: parseInt(document.getElementById('editProjectCategory').value) || null
    };
    try {
      const res = await fetch(`${API_BASE}/api/admin/projects/${editId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        showStatus('作品已更新', 'success');
        closeEditModal();
        loadAdminProjects();
        sendSystemNotification('✏️ 作品编辑', `已更新作品 ID: ${editId}`, 'project-edit');
      } else {
        const err = await res.json();
        showStatus('更新失败：' + (err.error || '未知错误'), 'error');
      }
    } catch (e) {
      showStatus('网络错误', 'error');
    }
  }
}

function closeEditModal() {
  document.getElementById('editModal').style.display = 'none';
  editId = null;
  editType = '';
}

  const token = getToken();
  if (token) {
    document.getElementById('loginArea').style.display = 'none';
    document.getElementById('adminArea').style.display = 'block';
    loadCategoriesWithDelete();

      document.getElementById('notifBtn').textContent = '🔔 已授权';

}
